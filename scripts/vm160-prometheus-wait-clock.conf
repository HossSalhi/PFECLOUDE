[Unit]
# Prometheus must not start until the clock is genuinely NTP-synchronised.
# Otherwise it may start with a skewed (boot-time) clock, write future-timestamped
# samples, and then reject all subsequent samples ("out of bounds") once the clock
# is corrected — which silently breaks all metrics (the AIOps pipeline sees zeros).
After=systemd-timesyncd.service time-sync.target network-online.target
Wants=time-sync.target network-online.target

[Service]
# Block up to 90s until the system clock is actually synchronised, then proceed.
ExecStartPre=/bin/bash -c 'for i in $(seq 1 90); do [ "$(timedatectl show -p NTPSynchronized --value)" = "yes" ] && exit 0; sleep 1; done; exit 0'
