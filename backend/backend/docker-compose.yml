# Legacy local development stack. Not part of the target 5-VM offline runtime.
services:
  postgres:
    image: postgres:16
    container_name: pfe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pfe_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pfe_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build: ./ai-service
    container_name: pfe-ai-service
    restart: unless-stopped
    environment:
      AIOPS_ENABLE_UPSTREAM_QUERIES: "false"
      AIOPS_LOG_LEVEL: "INFO"
    ports:
      - "8000:8000"

  backend:
    build: .
    container_name: pfe-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pfe_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DEVTOOLS_RESTART_ENABLED: "false"
      AIOPS_SERVICE_BASE_URL: ${AIOPS_SERVICE_BASE_URL:-http://ai-service:8000}
    ports:
      - "8081:8080"

volumes:
  pgdata:
