services:
  postgres:
    image: postgres:16
    container_name: pfe-postgres-dev
    environment:
      POSTGRES_DB: pfe_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pfe_postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pfe_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pfe_postgres_dev:
