spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.initializationFailTimeout=0

# Flyway disabled for tests — migrations use PostgreSQL-specific syntax incompatible with H2
spring.flyway.enabled=false

logging.level.root=WARN
logging.level.com.orange.pfe.backend=INFO

aiops.service.base-url=http://localhost:8000
camunda.enabled=false
