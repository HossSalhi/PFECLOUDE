logging.level.io.grpc=ERROR
logging.level.io.netty=ERROR
logging.level.io.camunda=WARN
logging.level.io.zeebe=WARN
logging.level.org.springframework.web.reactive=WARN
logging.level.reactor.netty=ERROR
logging.level.org.springframework.security.config.annotation.authentication.configuration=ERROR
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{incidentId:-}] [%X{traceId:-}] %logger{36} - %msg%n

