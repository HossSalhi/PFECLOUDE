# --- VMDOWN-POLICY : politique VM_DOWN (mise sous tension des VM) - 4 cibles automatiques depuis le 2026-11-06 ---
# DEFAUTS SURS, tout est FERME. URL/jeton du watchdog : remediation.master-watchdog-url / master-watchdog-token.
# Un demarrage reel n est demande que si enabled=true ET dry-run=false ET la VM figure dans active-vms.
# Table fermee (noms exacts) : AUTO k8s-worker1, k8s-worker2, k8s-lb2 (chaine Camunda) ; k8s-monitoring (.160) = DETECTION
# SEULE (VM de supervision : incident + interface, ni e-mail ni Camunda ni redemarrage, meme si elle figurait dans active-vms) ;
# k8s-master (.153) n est JAMAIS une cible (il peut rester appelant).
helios.vmpower.enabled=${HELIOS_VMPOWER_ENABLED:false}
helios.vmpower.dry-run=${HELIOS_VMPOWER_DRYRUN:true}
helios.vmpower.active-vms=${HELIOS_VMPOWER_ACTIVE_VMS:}
helios.vmpower.cycle-seconds=${HELIOS_VMPOWER_CYCLE_SECONDS:15}
helios.vmpower.direct-verify-budget-minutes=${HELIOS_VMPOWER_DIRECT_VERIFY_BUDGET_MINUTES:6}

# Routage incident -> equipe (maintenance en cours sur la meme ressource) : e-mail au responsable, taches d equipe
# automatiques, suspension/reprise sur decision. DESACTIVE par defaut : ne s active que volontairement.
helios.routing.enabled=${HELIOS_INCIDENT_ROUTING_ENABLED:false}
helios.routing.scheduler-delay-ms=${HELIOS_INCIDENT_ROUTING_DELAY_MS:30000}
helios.routing.lookback-hours=${HELIOS_INCIDENT_ROUTING_LOOKBACK_HOURS:24}
helios.routing.public-base-url=${HELIOS_PUBLIC_BASE_URL:https://helios.orange.tn}

