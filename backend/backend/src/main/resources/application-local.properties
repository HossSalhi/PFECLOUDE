# ── Profil local — PostgreSQL via Docker Compose (docker-compose.dev.yml) ────
spring.datasource.url=jdbc:postgresql://localhost:5433/pfe_db
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration

# DevTools : redémarrage auto à chaque compilation
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Logs dev
logging.level.com.orange.pfe.backend=DEBUG
logging.level.root=WARN

# CORS local
app.security.cors-allowed-origins=http://localhost:4200,http://localhost:3000

# Désactiver tout ce qui nécessite les VMs
aiops.polling.enabled=false
aiops.polling.watch-enabled=false
infra.health.enabled=false
camunda.enabled=false
fault.crash-on-startup=false
notification.webhook.enabled=false

# Swagger activé en local
app.security.expose-api-docs=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# JWT secret de dev
jwt.secret=bXlTdXBlclNlY3JldEtleUZvckpXVEF1dGhlbnRpY2F0aW9uMjAyNA==
jwt.expiration-ms=86400000

# Pool réduit en local
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

