apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: auto-scrape-all-apps
  namespace: monitoring
  labels:
    release: prometheus
spec:
  # Surveille tous les namespaces utilisateur
  namespaceSelector:
    any: true
  # Sélectionne les pods avec l'annotation prometheus.io/scrape=true
  selector:
    matchExpressions:
      - key: app
        operator: Exists
  podMetricsEndpoints:
    - relabelings:
        # Garde uniquement les pods annotés prometheus.io/scrape=true
        - sourceLabels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: "true"
        # Utilise le path de l'annotation (défaut: /actuator/prometheus)
        - sourceLabels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          action: replace
          targetLabel: __metrics_path__
          regex: (.+)
          replacement: $1
        - targetLabel: __metrics_path__
          replacement: /actuator/prometheus
          action: replace
        # Utilise le port de l'annotation
        - sourceLabels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          targetLabel: __address__
        # Labels utiles
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_pod_label_app]
          targetLabel: application
      interval: 15s
