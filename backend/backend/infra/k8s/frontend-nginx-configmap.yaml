apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-conf
  namespace: pfe
  labels:
    app: frontend
data:
  default.conf: |
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # HTTP on 8080 — kept for K8s probes + cluster-internal traffic
    server {
        listen 8080;
        server_name _;

        resolver 10.96.0.10 valid=30s ipv6=off;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options    "nosniff"                         always;
        add_header X-Frame-Options           "SAMEORIGIN"                      always;
        add_header X-XSS-Protection          "1; mode=block"                   always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

        location / {
            try_files $uri $uri/ /index.html;
        }

        set $backend_upstream "backend.pfe.svc.cluster.local:8080";

        location /api/ {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass http://$backend_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        location /api/events/ {
            proxy_pass http://$backend_upstream;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header Connection "";
            proxy_http_version  1.1;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_buffering     off;
            proxy_cache         off;
            chunked_transfer_encoding on;
        }

        location /actuator/ {
            proxy_pass http://$backend_upstream;
            proxy_set_header Host      $host;
            proxy_set_header X-Real-IP $remote_addr;
            allow 10.0.0.0/8;
            allow 192.168.0.0/16;
            deny  all;
        }

        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
        gzip_min_length 1000;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # HTTPS on 8443 — TLS termination for external browser access
    # Cert: K8s secret "helios-tls" mounted at /etc/nginx/tls/
    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate      /etc/nginx/tls/tls.crt;
        ssl_certificate_key  /etc/nginx/tls/tls.key;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  1d;
        ssl_session_tickets  off;

        resolver 10.96.0.10 valid=30s ipv6=off;
        root /usr/share/nginx/html;
        index index.html;

        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff"                              always;
        add_header X-Frame-Options           "SAMEORIGIN"                           always;
        add_header X-XSS-Protection          "1; mode=block"                        always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"       always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

        location / {
            try_files $uri $uri/ /index.html;
        }

        set $backend_upstream "backend.pfe.svc.cluster.local:8080";

        location /api/ {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass http://$backend_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        location /api/events/ {
            proxy_pass http://$backend_upstream;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header Connection "";
            proxy_http_version  1.1;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_buffering     off;
            proxy_cache         off;
            chunked_transfer_encoding on;
        }

        location /actuator/ {
            proxy_pass http://$backend_upstream;
            proxy_set_header Host      $host;
            proxy_set_header X-Real-IP $remote_addr;
            allow 10.0.0.0/8;
            allow 192.168.0.0/16;
            deny  all;
        }

        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
        gzip_min_length 1000;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }
