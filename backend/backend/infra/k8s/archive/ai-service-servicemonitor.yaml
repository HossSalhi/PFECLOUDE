apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ai-service
  namespace: monitoring
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - pfe
  selector:
    matchLabels:
      app: ai-service
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
