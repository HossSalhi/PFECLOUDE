apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: pfe
  labels:
    app: backend
    aiops.io/monitor: "true"
    # HELIOS se surveille LUI-MEME (meme perimetre que le detecteur camunda-direct / Grafana =
    # tout le cluster). Mettre "false" pour re-exclure le backend s'il se remedie a tort.
    helios.io/monitor: "true"
    aiops.io/app: "backend"
spec:
  replicas: 2
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0       # air-gap: 2 workers + anti-affinity → no room for a 3rd pod; kill first
      maxUnavailable: 1 # kill one old pod before starting new (no scheduling deadlock)
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        aiops.io/monitor: "true"
        aiops.io/app: "backend"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: backend-remediator
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-type
                    operator: In
                    values: [worker]       # never schedule on master
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: backend           # prefer different workers, but allow same if one fails
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway  # spread across zones, fall back to one zone if needed
          labelSelector:
            matchLabels:
              app: backend
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60              # evict from failed worker after 60s
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: backend
          # 0.2.82 = 14 types distincts : +4 marqueurs (PENDING/INIT/CONFIG/DEPLOYMENT_UNAVAILABLE),
          #          http error/latency -> ROLLBACK, titres/rationale par type, cleanupBrokenPods etendu
          #          (config/init/pending/evicted). Conserve 0.2.81 (suppr GENERAL_DEGRADATION + dedup +
          #          rollback cible RS saine).
          # 0.2.85 = disk fiable : hasEvictedPod ne se declenche que sur UNE seule revision Running
          #          (pas pendant le rollout FORCE_RECREATE = 2 hash) -> la verif ne re-voit plus le
          #          transient -> NODE_DISK_PRESSURE RESOLU de facon stable. + 0.2.84 (transient-rollout).
          # 0.2.92 = RESOLUTION REELLE : auto-resolve ne court-circuite plus la remediation Camunda.
          #          Tant que l'action est PENDING/IN_PROGRESS ou le workflow actif (incident <8min),
          #          on laisse l'execute worker lancer la VRAIE commande kubectl (tracee "$ kubectl ...")
          #          et le verify conclure -> plus d'incident "resolved" sans commande (action PENDING).
          # 0.2.93 = DEBIT WORKER : execute maxJobsActive 2->16, verify 1->16, threads 8->24, verify
          #          timeout 6min. 16 incidents simultanes -> les jobs execute ne restent plus ACTIVE
          #          non-draines dans Zeebe (action PENDING bloquee). + reset annule TOUS les PIs (0 orphelin).
          # 0.2.94 = VRAIE CAUSE : WorkflowNotFoundException = RACE de transaction (le PI Camunda est cree
          #          DANS la tx qui ecrit workflow_instance -> le worker active le job execute AVANT le
          #          commit -> faux "orphelin" droppe retries=0 -> action PENDING a vie). Fix: sur not-found,
          #          on RETRY avec backoff 6s (le commit arrive), drop seulement apres epuisement (vrai orphelin).
          # 0.2.95 = DISK = 16e type distinct : le pod evince (EmptyDir>sizeLimit) est remplace en <30s donc
          #          l'etat pod (Evicted/Succeeded) est rate au polling -> on detecte aussi via l'EVENEMENT
          #          kubelet "Evicted ... exceeds the limit" (persiste ~1h, fenetre 5min, detection seule)
          #          -> disk_pressure_detected -> NODE_DISK_PRESSURE (au lieu de POD_CRASH_LOOP).
          # 0.2.96 = 2 derniers fix : (a) NODE_DISK_PRESSURE+DELETE = action POD sure -> process AUTO (plus
          #          le process node a approbation humaine qui timeout a 5min -> FAILED). (b) AUTOSCALING :
          #          verify "scale mode" = succes quand les repliques sont pretes (la charge soutenue est
          #          ATTENDUE, c'est la raison du scale-up) au lieu d'exiger que l'IA ne voie plus la charge.
          # 0.2.97 = crashloop detecte tot (test manuel) : hasCrashLoopBackOff catch la fenetre RUNNING entre
          #          deux crashs (lastState.terminated exit!=0 + restarts>=2 + pas Ready) -> POD_CRASH_LOOP +
          #          ROLLBACK au lieu de DEPLOYMENT_UNAVAILABLE + FORCE_RECREATE (qui ne corrige pas le spec).
          # 0.2.98 = ferme le trou restartCount==1 : un crash applicatif (exit code != 0/137/143) au PREMIER
          #          redemarrage = POD_CRASH_LOOP des le 1er poll -> plus de doublon DEPLOYMENT_UNAVAILABLE
          #          (RESOLUTION_FAILED) suivi de POD_CRASH_LOOP. Kills (137/143) et stop propre (0) exclus.
          # 0.2.109 = trace noeud PRO : la trace Camunda de l'escalade affiche la commande de
          #          recuperation equivalente ($ vmrun start <node>) + resultat d'action noeud explicite,
          #          pour que l'incident NOEUD montre sa commande comme les apps montrent leur kubectl.
          # 0.2.110 = anti-flood node-down BLINDE : (1) detection rapide via le Lease kube-node-lease
          #          (renewTime fige ~25-30s avant le flip NotReady ~40s) -> pause per-app AVANT le flood
          #          (fini le DEPLOYMENT_UNAVAILABLE RESOLUTION_FAILED cree pendant la course). (2) grace
          #          post-recovery 180->300s. (3) suppression aussi si node_not_ready_count>0 (ceinture+bretelles).
          # 0.2.111 = coherence severite : la description enrichie par l'IA affiche la severite AUTORITAIRE
          #          de l'incident (severityFor: CRITICAL pour une panne noeud), plus la severite IA
          #          degradee -> le detail affiche CRITICAL comme le tableau (fini HIGH vs CRITICAL).
          # 0.2.112 = email RESOLUTION detaille au superuser : a la cloture Camunda, HELIOS envoie un
          #          rapport complet (detection + decision IA + trace Camunda/kubectl + verif resolution)
          #          via sendIncidentResolvedWithTrace (reutilise les sections du rapport d'echec).
          # 0.2.113 = email RESOLUTION = replique complete de la page detail (design Orange) : ajoute la
          #          table "Actions de Remediation" (Type/Statut/Mode/Date/Resultat) + "Historique &
          #          Timeline" (transitions de statut) + "Mis a jour le". Repos action/history injectes.
          image: pfe-backend:0.2.114
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          readinessProbe:
            httpGet:
              path: /api/test/health-readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /api/test/health-readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/test/health-liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
