apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-remediator
  namespace: pfe
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-remediator
  namespace: pfe
rules:
  - apiGroups: [""]
    resources: ["pods"]
    # update/patch = retirer les finalizers d'un pod bloqué (POD_STUCK_TERMINATING).
    #
    # ⚠️ `create` RETIRÉ (audit sécurité 08/2026) — c'était une ESCALADE DE
    # PRIVILÈGES : ce verbe servait à créer un pod privilégié éphémère (HOST_EXEC)
    # qui exécutait une commande hôte via `nsenter`. Un pod privilégié + nsenter
    # équivaut à un accès root sur le nœud : un diagnostic IA erroné, ou une
    # injection de prompt réussie, donnait le contrôle total de la machine.
    #
    # Les actions sur l'hôte passent désormais par le bridge SSH avec :
    #   - une liste blanche stricte de commandes (RESTART_NODE_SERVICE, CLEANUP_NODE_DISK)
    #   - `risk: HIGH` => approbation humaine obligatoire
    #   - écoute sur 127.0.0.1 uniquement + token partagé
    #   - journalisation avant exécution
    # Voir : infra/remediation-action-catalog.yaml
    verbs: ["get", "list", "watch", "delete", "update", "patch"]
  # Lire les logs d'un pod (diagnostic d'incident)
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  # Remédiation réseau : identifier et supprimer la NetworkPolicy bloquante (partition/DNS/service)
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "delete"]
  # Phase MONITOR (alarme brute CPU sans IA) : lire la charge CPU des pods via metrics-server
  # (pipeline Camunda : détecter les pannes CPU_STRESS / AUTOSCALING qui n'ont pas de marqueur d'état).
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-remediator
  namespace: pfe
subjects:
  - kind: ServiceAccount
    name: backend-remediator
    namespace: pfe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backend-remediator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backend-remediator-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # Fast node-failure detection: a worker's node Lease (kube-node-lease) renewTime stops updating
  # within ~25-30s of the node dying — faster + more reliable than the ~40s Ready-condition flip.
  # Lets HELIOS pause per-app incident creation before a worker-down floods the table with collateral.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backend-remediator-node-reader
subjects:
  - kind: ServiceAccount
    name: backend-remediator
    namespace: pfe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backend-remediator-node-reader
---
# Allows the backend to list Deployments in all namespaces for AIOps auto-discovery
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backend-aiops-discovery
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backend-aiops-discovery
subjects:
  - kind: ServiceAccount
    name: backend-remediator
    namespace: pfe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backend-aiops-discovery
---
# Node operations: cordon (patch) + read node status
# Drain requires evicting pods from any namespace, so we add pod eviction cluster-wide
# but scope the node patch to minimize blast radius.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backend-remediator-node-ops
rules:
  # Cordon / uncordon = PATCH on nodes spec.unschedulable
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]
  # Drain: evict pods from any namespace (safer than bare delete)
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  # Drain also needs to list pods across namespaces to find what to evict
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # ReplicaSets needed to identify Deployment-owned pods during drain
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backend-remediator-node-ops
subjects:
  - kind: ServiceAccount
    name: backend-remediator
    namespace: pfe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backend-remediator-node-ops
