apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-remediator
  namespace: pfe
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-remediator
  namespace: pfe
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-remediator
  namespace: pfe
subjects:
  - kind: ServiceAccount
    name: backend-remediator
    namespace: pfe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backend-remediator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backend-remediator-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backend-remediator-node-reader
subjects:
  - kind: ServiceAccount
    name: backend-remediator
    namespace: pfe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backend-remediator-node-reader
---
# Allows the backend to list Deployments in all namespaces for AIOps auto-discovery
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backend-aiops-discovery
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backend-aiops-discovery
subjects:
  - kind: ServiceAccount
    name: backend-remediator
    namespace: pfe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backend-aiops-discovery
