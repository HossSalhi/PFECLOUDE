apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: pfe
data:
  # Fuseau horaire : déploiement à Tunis = UTC+1 toute l'année (PAS Europe/Paris,
  # qui passe en UTC+2 l'été). Le backend stocke createdAt en LocalDateTime (zone JVM),
  # donc TZ aligne les horodatages sur l'horloge de l'UI. NE PAS mettre Europe/Paris.
  TZ: "Africa/Tunis"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-rw.pfe.svc.cluster.local:5432/pfe_db"
  SPRING_DATASOURCE_USERNAME: "appuser"
  SPRING_DEVTOOLS_RESTART_ENABLED: "false"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"
  AIOPS_SERVICE_BASE_URL: "http://192.168.148.161:8000"
  CAMUNDA_ENABLED: "true"
  CAMUNDA_AUTO_DEPLOY_BPMN: "true"
  CAMUNDA_PROCESS_ID: "incident-remediation"
  CAMUNDA_REST_ADDRESS: "http://192.168.148.161:8080"
  CAMUNDA_GRPC_ADDRESS: "http://192.168.148.161:26500"
  CAMUNDA_PREFER_REST_OVER_GRPC: "false"
  CAMUNDA_REQUEST_TIMEOUT_SECONDS: "60"
  CAMUNDA_JOB_POLL_INTERVAL_SECONDS: "2"
  CAMUNDA_WORKER_MAX_JOBS_ACTIVE: "4"
  LAB_HOST_IP: "192.168.148.161"
  REMEDIATION_AUTOMATION_ENABLED: "true"
  REMEDIATION_ALLOWED_ACTIONS: "RESTART_POD,SCALE_DEPLOYMENT,DELETE_CRASHLOOPING_PODS,FORCE_RECREATE_DEPLOYMENT"
  REMEDIATION_RESTART_CONFIDENCE_THRESHOLD: "0.45"
  REMEDIATION_SCALE_CONFIDENCE_THRESHOLD: "0.44"
  REMEDIATION_VERIFICATION_INCIDENT_CONFIDENCE_THRESHOLD: "0.55"
  REMEDIATION_COOLDOWN_MINUTES: "2"
  REMEDIATION_VERIFY_DELAY_SECONDS: "25"
  REMEDIATION_VERIFICATION_WINDOW_MINUTES: "1"
  # 12x15s = 180s max per verify. Augmente de 7 a 12 : sous pression RAM (worker tombe, ou
  # eviction des demos basse-priorite), une app peut mettre >2 min a redevenir schedulable ;
  # 7 essais (~105s) la marquaient en FAUX RESOLUTION_FAILED alors qu'elle recuperait juste apres.
  REMEDIATION_VERIFICATION_RETRY_ATTEMPTS: "12"
  REMEDIATION_VERIFICATION_RETRY_DELAY_SECONDS: "15"
  # Wildcard = toutes les apps pfe sont eligibles (demo) ; lister explicitement en prod
  REMEDIATION_ALLOWLISTED_APPS: "*"
  REMEDIATION_ALLOWLISTED_NAMESPACES: "pfe"
  REMEDIATION_MAX_AUTO_SCALE_REPLICAS: "2"
  REMEDIATION_MAX_SCALE_STEP: "1"
  AIOPS_POLLING_ENABLED: "true"
  AIOPS_POLLING_INTERVAL_MILLIS: "30000"
  AIOPS_POLLING_NAMESPACE: "pfe"
  AIOPS_CLIENT_READ_TIMEOUT_MS: "30000"
  # HELIOS ne surveille PAS sa propre stack (backend/frontend/ai-service...).
  # On poll explicitement les 7 apps demo dediees (1 type de panne distinct chacune).
  # podinfo est EXCLU (baseline chaos a l'historique de revisions pollue -> rollbacks
  # imprevisibles + bruit MEMORY_STRESS) : retire de la liste ET label helios.io/monitor=false.
  # La decouverte auto exclut tout deployment portant le label helios.io/monitor=false.
  AIOPS_POLLING_APPS: "helios-crashloop,helios-imagepull,helios-oom,helios-cpu,helios-service,helios-network,helios-dns"
  AIOPS_POLLING_WINDOW_MINUTES: "1"
  # Découverte auto réactivée : podinfo apparaît dans "Deployments Kubernetes".
  # Les apps démo cassées (incident-*) + la stack HELIOS (backend/frontend) sont exclues
  # via le label helios.io/monitor=false (sinon flood d'incidents permanents).
  AIOPS_POLLING_DISCOVERY_ENABLED: "true"
  INFRA_HEALTH_ENABLED: "true"
  # 60s (et non 300s) : l'auto-remédiation rallume un worker en ~2 min, donc une
  # détection nœud toutes les 5 min ratait les pannes courtes (worker réparé entre
  # deux ticks). 60s garantit que la panne est captée avant la réparation.
  INFRA_HEALTH_INTERVAL_SECONDS: "30"
  INFRA_HEALTH_TIMEOUT_SECONDS: "10"
  INFRA_HEALTH_PROMETHEUS_URL: "http://192.168.148.160:9090"
  INFRA_HEALTH_LOKI_URL: "http://192.168.148.160:3100"
  INFRA_HEALTH_GRAFANA_URL: "http://192.168.148.160:3000"
  INFRA_HEALTH_AI_SERVICE_URL: "http://192.168.148.161:8000"
  INFRA_HEALTH_CAMUNDA_URL: "http://192.168.148.161:8080"
  INFRA_HEALTH_OLLAMA_URL: "http://192.168.148.161:11434"
  # Inclut la VIP HA 192.168.148.150 : c'est l'URL d'acces STABLE (flotte vers un noeud vivant).
  # Sans elle, le login via la VIP echoue en 403 (origine CORS non autorisee).
  APP_SECURITY_CORS_ALLOWED_ORIGINS: "http://192.168.148.153:30880,http://192.168.148.158:30880,http://192.168.148.155:30880,http://192.168.148.150:30880"
  # SecurityStartupValidator : en prod réelle, fournir un vrai JWT_SECRET
  # (openssl rand -base64 32) + BACKEND_API_PASSWORD via le Secret, puis remettre
  # à "true". "false" = parité avec l'ancienne image (secrets par défaut, pas d'abort).
  SECURITY_STRICT_MODE: "false"
  # Rôles utilisateurs (override via Secret en production)
  SUPER_ADMIN_USERNAME: "superadmin"
  ADMIN_USERNAME: "admin"
  USER_USERNAME: "operator"
  # Notifications email — relais SMTP -> Gmail réel.
  # IMPORTANT (12/06/2026) : le TCP sortant des VMs vers Internet est bloqué côté hôte,
  # donc le relais sur .161:2525 ne joint plus Gmail. Workaround EN PROD : relais sur
  # l'HÔTE (qui a Internet) = 192.168.148.1:2526 (C:\Users\houss\helios-host-relay.py,
  # lancé au logon via Startup\helios-relay-startup.vbs). Vérifié : emails livrés à Gmail.
  # Si le TCP sortant de .161 est rétabli : remettre MAIL_HOST=192.168.148.161 MAIL_PORT=2525.
  # Démo locale sans Internet : MAIL_HOST=192.168.148.161 MAIL_PORT=1025 (MailHog, UI :8025).
  NOTIFICATION_EMAIL_ENABLED: "true"
  NOTIFICATION_EMAIL_TO: "houssamsalhi972@gmail.com"
  NOTIFICATION_EMAIL_FROM: "helios-aiops@orange.tn"
  # LOW = email pour toutes severites (demo) ; HIGH = seulement HIGH/CRITICAL (prod)
  NOTIFICATION_EMAIL_MIN_SEVERITY: "LOW"
  NOTIFICATION_MIN_SEVERITY: "LOW"
  # VIP HA (et non l'IP du master) : les liens des emails restent valides meme master coupe.
  NOTIFICATION_EMAIL_DASHBOARD_URL: "http://192.168.148.150:30880"
  # Relais SMTP (plaintext, pas d'auth, pas de STARTTLS) — host-relay (Internet OK)
  MAIL_HOST: "192.168.148.1"
  MAIL_PORT: "2526"
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
