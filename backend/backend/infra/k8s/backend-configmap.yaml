apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: pfe
data:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-rw.pfe.svc.cluster.local:5432/pfe_db"
  SPRING_DATASOURCE_USERNAME: "appuser"
  SPRING_DEVTOOLS_RESTART_ENABLED: "false"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"
  AIOPS_SERVICE_BASE_URL: "http://192.168.148.161:8000"
  CAMUNDA_ENABLED: "true"
  CAMUNDA_AUTO_DEPLOY_BPMN: "true"
  CAMUNDA_PROCESS_ID: "incident-remediation"
  CAMUNDA_REST_ADDRESS: "http://192.168.148.161:8080"
  CAMUNDA_GRPC_ADDRESS: "http://192.168.148.161:26500"
  CAMUNDA_PREFER_REST_OVER_GRPC: "false"
  CAMUNDA_REQUEST_TIMEOUT_SECONDS: "60"
  CAMUNDA_JOB_POLL_INTERVAL_SECONDS: "2"
  CAMUNDA_WORKER_MAX_JOBS_ACTIVE: "4"
  LAB_HOST_IP: "192.168.148.161"
  REMEDIATION_AUTOMATION_ENABLED: "true"
  REMEDIATION_ALLOWED_ACTIONS: "RESTART_POD,SCALE_DEPLOYMENT"
  REMEDIATION_RESTART_CONFIDENCE_THRESHOLD: "0.45"
  REMEDIATION_SCALE_CONFIDENCE_THRESHOLD: "0.44"
  REMEDIATION_VERIFICATION_INCIDENT_CONFIDENCE_THRESHOLD: "0.55"
  REMEDIATION_COOLDOWN_MINUTES: "30"
  REMEDIATION_VERIFY_DELAY_SECONDS: "120"
  REMEDIATION_VERIFICATION_WINDOW_MINUTES: "1"
  REMEDIATION_VERIFICATION_RETRY_ATTEMPTS: "10"
  REMEDIATION_VERIFICATION_RETRY_DELAY_SECONDS: "30"
  REMEDIATION_ALLOWLISTED_APPS: "backend,ai-service"
  REMEDIATION_ALLOWLISTED_NAMESPACES: "pfe"
  REMEDIATION_MAX_AUTO_SCALE_REPLICAS: "2"
  REMEDIATION_MAX_SCALE_STEP: "1"
  AIOPS_POLLING_ENABLED: "true"
  AIOPS_POLLING_INTERVAL_MILLIS: "120000"
  AIOPS_POLLING_NAMESPACE: "pfe"
  AIOPS_CLIENT_READ_TIMEOUT_MS: "30000"
  AIOPS_POLLING_APPS: "backend"
  AIOPS_POLLING_WINDOW_MINUTES: "5"
  AIOPS_POLLING_DISCOVERY_ENABLED: "true"
  INFRA_HEALTH_ENABLED: "true"
  INFRA_HEALTH_INTERVAL_SECONDS: "300"
  INFRA_HEALTH_TIMEOUT_SECONDS: "10"
  INFRA_HEALTH_PROMETHEUS_URL: "http://192.168.148.160:9090"
  INFRA_HEALTH_LOKI_URL: "http://192.168.148.160:3100"
  INFRA_HEALTH_GRAFANA_URL: "http://192.168.148.160:3000"
  INFRA_HEALTH_AI_SERVICE_URL: "http://192.168.148.161:8000"
  INFRA_HEALTH_CAMUNDA_URL: "http://192.168.148.161:8080"
  INFRA_HEALTH_OLLAMA_URL: "http://192.168.148.161:11434"
  APP_SECURITY_CORS_ALLOWED_ORIGINS: "http://192.168.148.153:30880,http://192.168.148.158:30880,http://192.168.148.155:30880"
  # Rôles utilisateurs (override via Secret en production)
  SUPER_ADMIN_USERNAME: "superadmin"
  ADMIN_USERNAME: "admin"
  USER_USERNAME: "operator"
  # Notifications email — MailHog SMTP local (http://192.168.148.161:8025)
  NOTIFICATION_EMAIL_ENABLED: "true"
  NOTIFICATION_EMAIL_FROM: "helios-aiops@orange.tn"
  NOTIFICATION_EMAIL_MIN_SEVERITY: "LOW"
  NOTIFICATION_EMAIL_DASHBOARD_URL: "http://192.168.148.153:30880"
  # Config SMTP MailHog (pas d'auth)
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
