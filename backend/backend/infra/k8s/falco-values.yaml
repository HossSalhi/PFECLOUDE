# HELIOS — valeurs Helm Falco (détection SÉCURITÉ eBPF -> incident -> IA -> Camunda).
#
# Installe une DÉTECTION de la catégorie Sécurité (crypto-mining, shell dans un conteneur,
# lecture de fichier sensible, écriture sous un binaire, escalade de privilèges…) qu'aucun
# signal Prometheus/état-K8s ne voit. Falco (sonde eBPF moderne CO-RE, aucun header noyau
# requis grâce au BTF) tourne en DaemonSet sur master+worker1+worker2 ; Falcosidekick POST
# chaque alerte vers le webhook backend (/api/webhooks/falco) qui crée un incident HELIOS et
# déclenche la remédiation Camunda (remplacement du pod compromis).
#
# Prérequis validés sur le cluster : helm v4, noyau 6.8 (>=5.8), /sys/kernel/btf/vmlinux présent.
# Install :
#   helm repo add falcosecurity https://falcosecurity.github.io/charts && helm repo update
#   helm upgrade --install falco falcosecurity/falco -n falco --create-namespace -f falco-values.yaml
#
# Empreinte modeste (cluster contraint) : ~128Mi/agent. Le webhook backend n'auto-remédie QUE
# les règles à haute confiance (voir FalcoWebhookController.isActionableRule) et JAMAIS les
# composants HELIOS (backend/frontend/postgres) — anti-boucle d'auto-sabotage.

driver:
  kind: modern_ebpf          # CO-RE : pas de compilation de module, pas de headers noyau

falco:
  json_output: true
  json_include_output_property: true
  log_level: info
  http_output:
    enabled: true
    url: "http://falco-falcosidekick:2801"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 384Mi

falcosidekick:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  config:
    debug: false
    webhook:
      address: "http://backend.pfe.svc.cluster.local:8080/api/webhooks/falco"
      method: POST
      minimumpriority: notice
    # AUTHENTIFICATION DU WEBHOOK (HELIOS L08+) : le backend refuse (401) toute requete sans l'en-tete X-Helios-Falco-Token.
    # Le jeton n'est JAMAIS dans ce fichier ni dans le Secret genere par le chart (ecrase a chaque `helm upgrade`) : il vit dans le Secret
    # falco/falcosidekick-helios-webhook (cle WEBHOOK_CUSTOMHEADERS, valeur « X-Helios-Falco-Token:<jeton> », UN seul « : », sans « , »),
    # reference ci-dessous. `env` l'emporte sur `envFrom` : le parametrage survit donc a un upgrade. Chart falcosidekick 0.12.x :
    # `config.extraEnv` est ajoute a la liste `env` du conteneur. Creation du Secret (hors Git) :
    #   kubectl -n falco create secret generic falcosidekick-helios-webhook --from-literal=WEBHOOK_CUSTOMHEADERS="X-Helios-Falco-Token:$TOKEN"
    # avec $TOKEN = la valeur de HELIOS_FALCO_WEBHOOK_TOKEN du Secret pfe/backend-secret. Format verifie dans le code 2.32.0 (config.go) :
    # WEBHOOK_CUSTOMHEADERS = "Nom:valeur,Nom2:valeur2".
    extraEnv:
      - name: WEBHOOK_CUSTOMHEADERS
        valueFrom:
          secretKeyRef:
            name: falcosidekick-helios-webhook
            key: WEBHOOK_CUSTOMHEADERS
