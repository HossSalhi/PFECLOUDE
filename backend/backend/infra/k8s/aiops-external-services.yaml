---
# Namespace pour les services externes AIOps (iacamunda VM)
apiVersion: v1
kind: Namespace
metadata:
  name: aiops
  labels:
    kubernetes.io/metadata.name: aiops
---
# AI Service (XGBoost + proactive monitor)
# http://ai-service.aiops.svc.cluster.local:8000
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: aiops
spec:
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ai-service
  namespace: aiops
subsets:
  - addresses:
      - ip: 192.168.148.161
    ports:
      - name: http
        port: 8000
---
# Camunda BPM
# http://camunda.aiops.svc.cluster.local:8080
apiVersion: v1
kind: Service
metadata:
  name: camunda
  namespace: aiops
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Endpoints
metadata:
  name: camunda
  namespace: aiops
subsets:
  - addresses:
      - ip: 192.168.148.161
    ports:
      - name: http
        port: 8080
---
# Ollama LLM
# http://ollama.aiops.svc.cluster.local:11434
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: aiops
spec:
  ports:
    - name: http
      port: 11434
      targetPort: 11434
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ollama
  namespace: aiops
subsets:
  - addresses:
      - ip: 192.168.148.161
    ports:
      - name: http
        port: 11434
