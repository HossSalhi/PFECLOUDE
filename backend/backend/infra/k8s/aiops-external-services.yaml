---
# Namespace pour les services externes (VM iacamunda / Camunda)
# Retrait de l'IA (11 nov. 2026) : les Services « ai-service » (:8000) et « ollama » (:11434) ont été retirés ;
# il ne reste que Camunda. Archive de sécurité : helios-state\snapshots\ai-removal-20261106.
apiVersion: v1
kind: Namespace
metadata:
  name: aiops
  labels:
    kubernetes.io/metadata.name: aiops
---
# Camunda BPM
# http://camunda.aiops.svc.cluster.local:8080
apiVersion: v1
kind: Service
metadata:
  name: camunda
  namespace: aiops
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Endpoints
metadata:
  name: camunda
  namespace: aiops
subsets:
  - addresses:
      - ip: 192.168.148.161
    ports:
      - name: http
        port: 8080
