apiVersion: v1
kind: Service
metadata:
  name: prometheus-external-nodeport
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus-external-nodeport
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: prometheus
    operator.prometheus.io/name: prometheus-kube-prometheus-prometheus
  ports:
    - name: http-web
      port: 9090
      targetPort: 9090
      nodePort: 30090
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: loki-external-nodeport
  namespace: monitoring
  labels:
    app.kubernetes.io/name: loki-external-nodeport
spec:
  type: NodePort
  selector:
    app.kubernetes.io/component: gateway
    app.kubernetes.io/instance: loki
    app.kubernetes.io/name: loki
  ports:
    - name: http-metrics
      port: 80
      targetPort: http-metrics
      nodePort: 31080
      protocol: TCP
