      containers:
        - { name: app, image: stefanprodan/podinfo:6.7.0, imagePullPolicy: IfNotPresent, resources: { requests: { cpu: "50m", memory: "32Mi" }, limits: { cpu: "1200m", memory: "96Mi" } } }
---
# 5) SERVICE_UNAVAILABLE  (inject: NetworkPolicy deny ingress -> delete policy)
apiVersion: apps/v1
kind: Deployment
metadata: { name: helios-service, namespace: pfe, labels: { app: helios-service } }
