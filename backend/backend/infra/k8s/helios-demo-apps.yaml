      containers:
        - { name: app, image: stefanprodan/podinfo:6.7.0, imagePullPolicy: IfNotPresent, resources: { requests: { cpu: "10m", memory: "32Mi" }, limits: { cpu: "200m", memory: "96Mi" } } }
---
# 7) DNS_FAILURE  (inject: NetworkPolicy egress sans port 53 -> delete policy)
apiVersion: apps/v1
kind: Deployment
metadata: { name: helios-dns, namespace: pfe, labels: { app: helios-dns } }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector: { matchLabels: { app: helios-dns } }
  template:
    metadata: { labels: { app: helios-dns } }
    spec:
      nodeSelector: { node-type: worker }
      containers:
        - { name: app, image: stefanprodan/podinfo:6.7.0, imagePullPolicy: IfNotPresent, resources: { requests: { cpu: "10m", memory: "32Mi" }, limits: { cpu: "200m", memory: "96Mi" } } }
---
# 8) NODE_DISK_PRESSURE  (inject: remplir emptyDir -> eviction -> rollout restart)
apiVersion: apps/v1
kind: Deployment
metadata: { name: helios-disk, namespace: pfe, labels: { app: helios-disk } }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector: { matchLabels: { app: helios-disk } }
  template:
    metadata: { labels: { app: helios-disk } }
    spec:
      nodeSelector: { node-type: worker }
      containers:
        - name: app
          image: stefanprodan/podinfo:6.7.0
          imagePullPolicy: IfNotPresent
          resources: { requests: { cpu: "10m", memory: "32Mi" }, limits: { cpu: "200m", memory: "96Mi", ephemeral-storage: "60Mi" } }
          volumeMounts: [ { name: data, mountPath: /data } ]
      volumes:
        - name: data
          emptyDir: { sizeLimit: "50Mi" }
---
# 9) HIGH_ERROR_RATE  (inject: ./podinfo --random-error=true -> rollback) + Service pour le load-gen
apiVersion: apps/v1
kind: Deployment
metadata: { name: helios-http5xx, namespace: pfe, labels: { app: helios-http5xx } }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector: { matchLabels: { app: helios-http5xx } }
  template:
    metadata: { labels: { app: helios-http5xx } }
    spec:
      nodeSelector: { node-type: worker }
      containers:
        - { name: app, image: stefanprodan/podinfo:6.7.0, imagePullPolicy: IfNotPresent, ports: [ { containerPort: 9898 } ], resources: { requests: { cpu: "10m", memory: "32Mi" }, limits: { cpu: "200m", memory: "96Mi" } } }
---
apiVersion: v1
kind: Service
metadata: { name: helios-http5xx, namespace: pfe }
spec: { selector: { app: helios-http5xx }, ports: [ { port: 9898, targetPort: 9898 } ] }
---
