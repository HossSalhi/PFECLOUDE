# HELIOS demo : 14 apps SAINES (baseline correcte), 1 type d'incident distinct chacune.
# Les pannes REPARABLES sont injectees apres par scripts/inject_demo_faults.py -> HELIOS detecte
# le type distinct ET le resout (rollback / rollout restart / delete networkpolicy).
# Image podinfo cachee (air-gap, :6.7.0). LimitRange pfe : min 10m/32Mi, max 2/2Gi par conteneur.
# --- ConfigMap utilisee par helios-config (baseline saine) ---
apiVersion: v1
kind: ConfigMap
metadata: { name: helios-config-cm, namespace: pfe }
data: { GREETING: "hello-from-helios" }
---
# 1) POD_CRASH_LOOP  (inject: command exit 1 -> rollback)
apiVersion: apps/v1
kind: Deployment
metadata: { name: helios-crashloop, namespace: pfe, labels: { app: helios-crashloop } }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector: { matchLabels: { app: helios-crashloop } }
  template:
    metadata: { labels: { app: helios-crashloop } }
    spec:
      nodeSelector: { node-type: worker }
      containers:
        - { name: app, image: stefanprodan/podinfo:6.7.0, imagePullPolicy: IfNotPresent, resources: { requests: { cpu: "10m", memory: "32Mi" }, limits: { cpu: "200m", memory: "96Mi" } } }
---
# 2) POD_IMAGE_PULL_BACKOFF  (inject: bad image -> rollback)
apiVersion: apps/v1
kind: Deployment
metadata: { name: helios-imagepull, namespace: pfe, labels: { app: helios-imagepull } }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector: { matchLabels: { app: helios-imagepull } }
  template:
    metadata: { labels: { app: helios-imagepull } }
    spec:
      nodeSelector: { node-type: worker }
      containers:
        - { name: app, image: stefanprodan/podinfo:6.7.0, imagePullPolicy: IfNotPresent, resources: { requests: { cpu: "10m", memory: "32Mi" }, limits: { cpu: "200m", memory: "96Mi" } } }
---
# 3) MEMORY_STRESS / OOM  (inject: tail /dev/zero -> rollback)
apiVersion: apps/v1
kind: Deployment
metadata: { name: helios-oom, namespace: pfe, labels: { app: helios-oom } }
spec:
  replicas: 1
  revisionHistoryLimit: 3
