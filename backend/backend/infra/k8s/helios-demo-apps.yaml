  template:
    metadata: { labels: { app: helios-oom } }
    spec:
      nodeSelector: { node-type: worker }
      containers:
        - { name: app, image: stefanprodan/podinfo:6.7.0, imagePullPolicy: IfNotPresent, resources: { requests: { cpu: "10m", memory: "32Mi" }, limits: { cpu: "200m", memory: "128Mi" } } }
---
# 4) CPU_STRESS  (inject: exec hog -> rollout restart)
apiVersion: apps/v1
kind: Deployment
metadata: { name: helios-cpu, namespace: pfe, labels: { app: helios-cpu } }
spec:
  replicas: 1
  revisionHistoryLimit: 3
