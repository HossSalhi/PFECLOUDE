---
apiVersion: v1
kind: Service
metadata: { name: helios-latency, namespace: pfe }
spec: { selector: { app: helios-latency }, ports: [ { port: 9898, targetPort: 9898 } ] }
---
# 11) POD_PENDING_INSUFFICIENT_RESOURCES  (inject: request cpu 2 + mem 2Gi -> Unschedulable -> rollback)
apiVersion: apps/v1
kind: Deployment
metadata: { name: helios-pending, namespace: pfe, labels: { app: helios-pending } }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector: { matchLabels: { app: helios-pending } }
  template:
    metadata: { labels: { app: helios-pending } }
    spec:
      nodeSelector: { node-type: worker }
      containers:
        - { name: app, image: stefanprodan/podinfo:6.7.0, imagePullPolicy: IfNotPresent, resources: { requests: { cpu: "10m", memory: "32Mi" }, limits: { cpu: "200m", memory: "96Mi" } } }
---
# 12) POD_INIT_CONTAINER_FAILURE  (inject: init command exit 1 -> rollback)
apiVersion: apps/v1
kind: Deployment
metadata: { name: helios-init, namespace: pfe, labels: { app: helios-init } }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector: { matchLabels: { app: helios-init } }
  template:
    metadata: { labels: { app: helios-init } }
    spec:
      nodeSelector: { node-type: worker }
      initContainers:
        - { name: init, image: stefanprodan/podinfo:6.7.0, imagePullPolicy: IfNotPresent, command: ["sh","-c","exit 0"], resources: { requests: { cpu: "10m", memory: "32Mi" }, limits: { cpu: "200m", memory: "64Mi" } } }
      containers:
        - { name: app, image: stefanprodan/podinfo:6.7.0, imagePullPolicy: IfNotPresent, resources: { requests: { cpu: "10m", memory: "32Mi" }, limits: { cpu: "200m", memory: "96Mi" } } }
---
# 13) POD_CONFIG_ERROR  (inject: envFrom configMap inexistant -> CreateContainerConfigError -> rollback)
apiVersion: apps/v1
kind: Deployment
metadata: { name: helios-config, namespace: pfe, labels: { app: helios-config } }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector: { matchLabels: { app: helios-config } }
  template:
    metadata: { labels: { app: helios-config } }
    spec:
      nodeSelector: { node-type: worker }
      containers:
        - name: app
          image: stefanprodan/podinfo:6.7.0
          imagePullPolicy: IfNotPresent
          envFrom: [ { configMapRef: { name: helios-config-cm } } ]
          resources: { requests: { cpu: "10m", memory: "32Mi" }, limits: { cpu: "200m", memory: "96Mi" } }
---
# 14) DEPLOYMENT_UNAVAILABLE  (inject: readiness probe vers chemin 404 -> NotReady -> rollback)
apiVersion: apps/v1
kind: Deployment
metadata: { name: helios-unavailable, namespace: pfe, labels: { app: helios-unavailable } }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector: { matchLabels: { app: helios-unavailable } }
  template:
    metadata: { labels: { app: helios-unavailable } }
    spec:
      nodeSelector: { node-type: worker }
      containers:
        - name: app
          image: stefanprodan/podinfo:6.7.0
          imagePullPolicy: IfNotPresent
          ports: [ { containerPort: 9898 } ]
          readinessProbe: { httpGet: { path: /healthz, port: 9898 }, initialDelaySeconds: 3, periodSeconds: 5 }
          resources: { requests: { cpu: "10m", memory: "32Mi" }, limits: { cpu: "200m", memory: "96Mi" } }
---
# 15) DATABASE_CONNECTIVITY  (inject: NetworkPolicy egress autorise DNS:53 mais bloque DB:5432 -> delete policy)
apiVersion: apps/v1
kind: Deployment
metadata: { name: helios-db, namespace: pfe, labels: { app: helios-db } }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector: { matchLabels: { app: helios-db } }
  template:
    metadata: { labels: { app: helios-db } }
    spec:
      nodeSelector: { node-type: worker }
      containers:
        - { name: app, image: stefanprodan/podinfo:6.7.0, imagePullPolicy: IfNotPresent, resources: { requests: { cpu: "10m", memory: "32Mi" }, limits: { cpu: "200m", memory: "96Mi" } } }
---
# 16) AUTOSCALING / HPA  (inject: hog CPU -> HELIOS detecte la montee en charge -> SCALE_DEPLOYMENT 1->N)
apiVersion: apps/v1
kind: Deployment
metadata: { name: helios-hpa, namespace: pfe, labels: { app: helios-hpa } }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector: { matchLabels: { app: helios-hpa } }
  template:
    metadata:
      labels: { app: helios-hpa }
      annotations: { helios.io/autoscale: "true" }   # opt-in : sous charge CPU -> scale up (pas restart)
    spec:
      nodeSelector: { node-type: worker }
      containers:
        - { name: app, image: stefanprodan/podinfo:6.7.0, imagePullPolicy: IfNotPresent, resources: { requests: { cpu: "50m", memory: "32Mi" }, limits: { cpu: "1000m", memory: "96Mi" } } }
---
# Load-gen : trafic continu vers les services http5xx + latency pour que /metrics expose 5xx/latence
apiVersion: apps/v1
kind: Deployment
metadata: { name: helios-loadgen, namespace: pfe, labels: { app: helios-loadgen, helios.io/monitor: "false" } }
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector: { matchLabels: { app: helios-loadgen } }
  template:
    metadata: { labels: { app: helios-loadgen, helios.io/monitor: "false" } }
    spec:
      nodeSelector: { node-type: worker }
      containers:
        - name: loadgen
          image: stefanprodan/podinfo:6.7.0
          imagePullPolicy: IfNotPresent
          command: ["sh","-c","(while true; do wget -q -T 8 -O /dev/null http://helios-http5xx:9898/ 2>/dev/null; sleep 0.2; done) & (while true; do wget -q -T 8 -O /dev/null http://helios-latency:9898/ 2>/dev/null; sleep 0.2; done) & wait"]
          resources: { requests: { cpu: "10m", memory: "32Mi" }, limits: { cpu: "200m", memory: "64Mi" } }
