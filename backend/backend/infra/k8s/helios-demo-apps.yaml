      nodeSelector: { node-type: worker }
      containers:
        - { name: app, image: stefanprodan/podinfo:6.7.0, imagePullPolicy: IfNotPresent, resources: { requests: { cpu: "10m", memory: "32Mi" }, limits: { cpu: "200m", memory: "96Mi" } } }
---
# 6) NETWORK_PARTITION  (inject: NetworkPolicy deny ingress+egress -> delete policy)
apiVersion: apps/v1
kind: Deployment
metadata: { name: helios-network, namespace: pfe, labels: { app: helios-network } }
spec:
  replicas: 1
  revisionHistoryLimit: 3
