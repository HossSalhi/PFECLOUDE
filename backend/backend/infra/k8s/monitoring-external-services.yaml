---
# Prometheus — accessible depuis tout le cluster via :
# http://prometheus.monitoring.svc.cluster.local:9090
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: Endpoints
metadata:
  name: prometheus
  namespace: monitoring
subsets:
  - addresses:
      - ip: 192.168.148.160
    ports:
      - name: http
        port: 9090
---
# Grafana — http://grafana.monitoring.svc.cluster.local:3000
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Endpoints
metadata:
  name: grafana
  namespace: monitoring
subsets:
  - addresses:
      - ip: 192.168.148.160
    ports:
      - name: http
        port: 3000
---
