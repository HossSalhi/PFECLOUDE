---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: pfe-quota
  namespace: pfe
spec:
  # Elargi (01/07/2026) : 17 apps demo (souvent 2 replicas) + stack HELIOS saturaient
  # l'ancien quota (limits.cpu 15,2/16, pods 37/40). Sous saturation, toute REMEDIATION
  # (rollback / FORCE_RECREATE / scale) doit creer un pod TRANSITOIRE en plus -> "exceeded
  # quota: pfe-quota" -> le deploiement ne guerit jamais -> RESOLUTION_FAILED / boucle de
  # fausses resolutions. NB : limits.cpu/limits.memory sont des PLAFONDS (throttling / OOM),
  # pas des reservations ; la vraie reservation = requests.* (usage reel ~1,3 CPU / 2,4Gi) ->
  # elargir les plafonds est sans danger pour les noeuds (le scheduler protege via requests).
  hard:
    requests.cpu: "8"
    requests.memory: "8Gi"
    limits.cpu: "32"
    limits.memory: "24Gi"
    pods: "80"
    persistentvolumeclaims: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: pfe-limits
  namespace: pfe
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      max:
        cpu: "2"
        memory: "2Gi"
      min:
        cpu: "10m"
        memory: "32Mi"
    - type: Pod
      max:
        cpu: "4"
        memory: "4Gi"
