apiVersion: v1
kind: ServiceAccount
metadata: { name: prom-external-scraper, namespace: kube-system }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: prom-external-scraper }
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, nodes/proxy, pods, services, endpoints]
    verbs: [get, list, watch]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: prom-external-scraper }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: prom-external-scraper }
subjects: [{ kind: ServiceAccount, name: prom-external-scraper, namespace: kube-system }]
---
apiVersion: v1
kind: Secret
metadata:
  name: prom-external-scraper-token
  namespace: kube-system
  annotations: { kubernetes.io/service-account.name: prom-external-scraper }
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: Service
metadata: { name: kube-state-metrics-nodeport, namespace: kube-system }
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: kube-state-metrics }
  ports: [{ name: http-metrics, port: 8080, targetPort: 8080, nodePort: 30809 }]
