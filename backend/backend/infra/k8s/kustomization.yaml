apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pfe

resources:
  - backend-configmap.yaml
  - backend-secret.yaml
  - backend-service.yaml
  - backend-deployment.yaml
  - backend-rbac.yaml
  - backend-pdb.yaml
  - postgres-cluster.yaml
  - postgres-scheduled-backup.yaml
  - frontend-nginx-configmap.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - network-policy.yaml
  - resource-quota.yaml
  - backend-hpa.yaml
  - frontend-pdb.yaml
  - postgres-pdb.yaml
  - prometheus-rules.yaml
  # ChromaDB runs on VM .161 in persistent mode (/data/chroma) — NOT in K8s.
  # The chromadb-* files are archived in infra/k8s/archive/ for reference only.

images:
  - name: pfe-backend
    newName: pfe-backend
    newTag: "0.2.6"
  - name: pfe-frontend
    newName: pfe-frontend
    newTag: "1.0.2"
  # pfe-ai-service runs on VM iacamunda — no K8s image needed
