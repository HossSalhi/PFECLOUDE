apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pfe

resources:
  - backend-configmap.yaml
  - backend-secret.yaml
  - backend-service.yaml
  - backend-deployment.yaml
  - backend-rbac.yaml
  - backend-pdb.yaml
  - postgres-cluster.yaml
  - postgres-scheduled-backup.yaml
  - frontend-nginx-configmap.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - network-policy.yaml
  - resource-quota.yaml
  - backend-hpa.yaml
  - frontend-pdb.yaml
  # ai-service runs on VM iacamunda (192.168.148.161:8000) — not in K8s
  - chromadb-pvc.yaml
  - chromadb-logconfig-configmap.yaml
  - chromadb-deployment.yaml
  - chromadb-service.yaml

images:
  - name: pfe-backend
    newName: pfe-backend
    newTag: "0.2.6"
  - name: pfe-frontend
    newName: pfe-frontend
    newTag: "1.0.2"
  # pfe-ai-service runs on VM iacamunda — no K8s image needed
