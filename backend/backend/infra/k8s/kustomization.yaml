apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pfe

resources:
  - backend-configmap.yaml
  - backend-secret.yaml
  - backend-service.yaml
  - backend-deployment.yaml
  - backend-rbac.yaml
  - backend-pdb.yaml
  - postgres-cluster.yaml
  - postgres-scheduled-backup.yaml
  - frontend-nginx-configmap.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - network-policy.yaml
  - resource-quota.yaml
  - backend-hpa.yaml
  - frontend-pdb.yaml
  - postgres-pdb.yaml
  - prometheus-rules.yaml

images:
  - name: pfe-backend
    newName: pfe-backend
    newTag: "0.2.6"
  - name: pfe-frontend
    newName: pfe-frontend
    newTag: "1.0.2"
