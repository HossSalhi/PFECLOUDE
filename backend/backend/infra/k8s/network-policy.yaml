---
# Default deny all ingress for pfe namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: pfe
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow external traffic (NodePort) to reach the frontend on HTTP and HTTPS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-ingress
  namespace: pfe
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8443
---
# Allow frontend pods and NodePort traffic to reach backend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-ingress
  namespace: pfe
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
  ingress:
    # From frontend pods
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - protocol: TCP
          port: 8080
    # From AI VM (.161), Monitoring VM (.160), and all internal nodes
    - from:
        - ipBlock:
            cidr: 192.168.148.0/24
      ports:
        - protocol: TCP
          port: 8080
---
# Allow backend (and CNPG replicas) to reach PostgreSQL pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-to-postgres
  namespace: pfe
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 5432
    # CNPG streaming replication between primary and replica
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: postgres
      ports:
        - protocol: TCP
          port: 5432
---
# Allow CNPG operator (in cnpg-system) to manage the postgres cluster
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cnpg-controller-to-postgres
  namespace: pfe
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 9187
---
# Allow external Prometheus (monitoring VM .160, scrape direct) to scrape postgres metrics exporter
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape-postgres
  namespace: pfe
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 192.168.148.160/32
      ports:
        - protocol: TCP
          port: 9187
---
# CRITIQUE (L21) : autoriser les sondes liveness/readiness du kubelet vers le
# gestionnaire d'instance CNPG (port 8000). SANS cette règle, default-deny fait
# échouer les probes -> Postgres redémarre en boucle. Les sondes viennent du nœud
# (IP du sous-réseau), pas d'un pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kubelet-probe-postgres
  namespace: pfe
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 192.168.148.0/24
      ports:
        - protocol: TCP
          port: 8000
---
# Backend egress: postgres + AI VM + Camunda + monitoring stack + DNS + K8s API
# All external traffic is scoped to 192.168.148.0/24 subnet for least privilege
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-egress
  namespace: pfe
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Egress
  egress:
    # DNS (CoreDNS in-cluster)
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # PostgreSQL via CNPG pods (same namespace, service routed through pod IP after DNAT)
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: postgres
      ports:
        - protocol: TCP
          port: 5432
    # External VMs (192.168.148.0/24):
    #   AI service (8000), Camunda REST (8080), Camunda gRPC (26500)
    #   Prometheus (9090), Grafana (3000), Loki read (3100), Loki push (3101)
    #   Ollama LLM (11434), K8s API server (6443), HTTPS (443)
    #   Backend/Frontend NodePort (30808, 30880)
    - to:
        - ipBlock:
            cidr: 192.168.148.0/24
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 26500
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 3100
        - protocol: TCP
          port: 3101
        - protocol: TCP
          port: 11434
        # Relais SMTP HELIOS (.161:2525) pour les notifications email — sinon L16 cassé
        - protocol: TCP
          port: 2525
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 30808
        - protocol: TCP
          port: 30880
        - protocol: TCP
          port: 30443
---
# Allow Prometheus (.160) to scrape backend /actuator/prometheus
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape-backend
  namespace: pfe
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 192.168.148.160/32
      ports:
        - protocol: TCP
          port: 8080
---
# Frontend egress: only needs to reach the backend (NodePort) and DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-egress
  namespace: pfe
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Egress
  egress:
    # DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Backend NodePort (requests routed through kube-proxy DNAT)
    - ports:
        - protocol: TCP
          port: 8080
    # Backend pods directly (in-cluster proxy routing)
    - to:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 8080
