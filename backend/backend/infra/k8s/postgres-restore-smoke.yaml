apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-restore-smoke
  namespace: pfe
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  storage:
    size: 5Gi
  monitoring:
    enablePodMonitor: false
  bootstrap:
    recovery:
      source: postgres
      database: pfe_db
      owner: postgres
      secret:
        name: postgres-app
  externalClusters:
    - name: postgres
      barmanObjectStore:
        destinationPath: s3://cnpg-backups/postgres
        endpointURL: http://192.168.148.160:9000
        serverName: postgres
        s3Credentials:
          accessKeyId:
            name: cnpg-backup-s3
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: cnpg-backup-s3
            key: SECRET_ACCESS_KEY
          region:
            name: cnpg-backup-s3
            key: AWS_REGION
