name: CI — PFE AIOps Backend

on:
  push:
    branches: ["main", "feature/**", "fix/**"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build, Test & Scan
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pfe_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build & run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/pfe_db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          CAMUNDA_ENABLED: "false"
          AIOPS_POLLING_ENABLED: "false"
          INFRA_HEALTH_ENABLED: "false"
          NOTIFICATION_WEBHOOK_ENABLED: "false"
        run: ./mvnw clean verify -B

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: target/*.jar
          retention-days: 7

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version tag
        id: tag
        run: echo "tag=$(date +'%Y%m%d')-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pfe-backend:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/pfe-backend.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ steps.tag.outputs.tag }}
          path: /tmp/pfe-backend.tar
          retention-days: 3

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pfe_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build JAR (skip tests)
        run: ./mvnw clean package -DskipTests -B -q

      - name: Start backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/pfe_db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          CAMUNDA_ENABLED: "false"
          AIOPS_POLLING_ENABLED: "false"
          INFRA_HEALTH_ENABLED: "false"
          NOTIFICATION_WEBHOOK_ENABLED: "false"
          SERVER_PORT: "8080"
        run: |
          java -jar target/*.jar \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/pfe_db \
            --spring.datasource.username=postgres \
            --spring.datasource.password=postgres \
            --camunda.enabled=false \
            --aiops.polling.enabled=false \
            --infra.health.enabled=false \
            --notification.webhook.enabled=false &
          echo "Backend PID: $!"
          echo "BACKEND_PID=$!" >> $GITHUB_ENV

      - name: Wait for backend to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf -u operator:operator-change-me http://localhost:8080/actuator/health/readiness > /dev/null 2>&1; then
              echo "Backend is ready"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 3
          done

      - name: Smoke test — health endpoints
        run: |
          echo "=== /actuator/health ==="
          curl -sf -u operator:operator-change-me http://localhost:8080/actuator/health | python3 -m json.tool

          echo "=== /api/dashboard/summary ==="
          curl -sf -u operator:operator-change-me http://localhost:8080/api/dashboard/summary | python3 -m json.tool

          echo "=== /api/incidents ==="
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u operator:operator-change-me "http://localhost:8080/api/incidents?page=0&size=5")
          echo "Incidents endpoint: HTTP $STATUS"
          [ "$STATUS" = "200" ]

          echo "=== /api/infrastructure/health ==="
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u operator:operator-change-me http://localhost:8080/api/infrastructure/health)
          echo "Infrastructure health: HTTP $STATUS"
          [ "$STATUS" = "200" ]

          echo "=== /api/finetuning/status ==="
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u operator:operator-change-me http://localhost:8080/api/finetuning/status)
          echo "Finetuning status: HTTP $STATUS"
          [ "$STATUS" = "200" ]

      - name: Stop backend
        if: always()
        run: kill $BACKEND_PID || true
