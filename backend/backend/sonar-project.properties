# HELIOS — configuration d'analyse qualité SonarQube (scanner Maven).
# Ajout non intrusif : n'altère pas la stack applicative ni le build runtime.
# Le token/serveur NE sont PAS stockés ici — fournis via variables d'environnement.
sonar.projectKey=helios-backend
sonar.projectName=HELIOS Backend
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.junit.reportPaths=target/surefire-reports
sonar.sourceEncoding=UTF-8
# Exclusions justifiées : microservice IA Python (hors build Maven, en cours de retrait),
# sauvegardes .bak, migrations Flyway (DDL versionné, non du code applicatif).
sonar.exclusions=**/ai-service/**,**/*.bak,src/main/resources/db/migration/**

# Exécution (serveur + jeton via ENV, jamais committés) :
#   $env:SONAR_HOST_URL="http://<serveur-sonarqube>:9000"
#   $env:SONAR_TOKEN="<token>"
#   .\mvnw.cmd -o test   # génère target/surefire-reports
#   .\mvnw.cmd org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar `
#       "-Dsonar.host.url=$env:SONAR_HOST_URL" "-Dsonar.token=$env:SONAR_TOKEN"
# Prérequis NON satisfait dans ce labo : aucun serveur SonarQube déployé (voir rapport).
