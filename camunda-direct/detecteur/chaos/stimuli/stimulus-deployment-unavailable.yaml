# Deployment 2 replicas dont la readinessProbe echoue toujours
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helios-cible
  namespace: {{NAMESPACE}}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: helios-cible
  template:
    metadata:
      labels:
        app: helios-cible
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{NODE}}
      containers:
      - name: cible
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command: ["sh","-c","sleep 3600"]
        readinessProbe:
          exec:
            command: ["sh","-c","exit 1"]
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            memory: 32Mi
            cpu: 50m
