# Pod appelant en boucle 192.168.148.250 (IP libre du LAN) : No route to host
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helios-cible
  namespace: {{NAMESPACE}}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helios-cible
  template:
    metadata:
      labels:
        app: helios-cible
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{NODE}}
      containers:
      - name: cible
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        # Aucune regle iptables, aucun tc, aucune modification reseau du cluster :
        # le pod appelle une IP LIBRE du LAN. La partition est vue DEPUIS le pod,
        # sans toucher au reseau des autres charges.
        command: ["sh","-c","while true; do wget -T 5 -q -O- http://192.168.148.250/ || echo 'wget: download timed out'; sleep 5; done"]
        resources:
          limits:
            memory: 32Mi
            cpu: 50m
