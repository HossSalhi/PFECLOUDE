# Deployment allouant de la memoire ANONYME sous limite cgroup 48Mi -> OOMKilled
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helios-cible
  namespace: {{NAMESPACE}}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helios-cible
  template:
    metadata:
      labels:
        app: helios-cible
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{NODE}}
      containers:
      - name: cible
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        # tmpfs monte en memoire : l'ecriture compte dans le cgroup du conteneur et
        # depasse la limite de 48Mi, ce qui declenche l'OOM killer du cgroup et lui
        # seul. La limite borne le stress au conteneur : le noeud n'est pas expose.
        command: ["sh","-c","dd if=/dev/zero of=/dev/shm/ballast bs=1M count=256; sleep 3600"]
        resources:
          limits:
            memory: 48Mi
            cpu: 50m
          requests:
            memory: 48Mi
