<div class="not-found-page">
  <div style="text-align:center;">
    <div class="error-code" style="font-size:120px;font-weight:900;color:var(--orange-primary);line-height:1;opacity:0.15;letter-spacing:-8px;margin-bottom:-30px;">
      404
    </div>
    <div style="position:relative;z-index:1;">
      <div style="width:72px;height:72px;background:var(--orange-pale);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;border:2px solid rgba(255,121,0,0.2);">
        <i class="fas fa-map-location-dot" style="font-size:30px;color:var(--orange-primary);"></i>
      </div>
      <h1 style="font-size:28px;font-weight:800;color:var(--gray-900);margin-bottom:10px;letter-spacing:-0.5px;">
        Page introuvable
      </h1>
      <p style="font-size:15px;color:var(--gray-500);margin-bottom:32px;max-width:380px;">
        La page que vous recherchez n'existe pas ou a été déplacée.
      </p>
      <button class="btn btn-orange" (click)="goHome()">
        <i class="fas fa-house"></i>
        Retour au tableau de bord
      </button>
    </div>
  </div>
</div>
