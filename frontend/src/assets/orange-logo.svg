<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <!-- Orange™ logo — square, solid orange, wordmark bottom-left -->
  <rect width="500" height="500" fill="#FF7900"/>

  <!-- "orange" — bold white, bottom-left, fills ~85% width -->
  <text
    x="18"
    y="446"
    font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="158"
    font-weight="900"
    fill="#FFFFFF"
    letter-spacing="-4">orange</text>

  <!-- ™ superscript -->
  <text
    x="422"
    y="360"
    font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="58"
    font-weight="700"
    fill="#FFFFFF">™</text>
</svg>
