# Limite les requêtes API : 30 req/s par IP, burst 60 sans délai
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    listen 80;
    server_name _;

    # Résolution DNS à la demande (évite crash si le backend n'est pas encore prêt)
    resolver 10.96.0.10 valid=30s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # En-têtes de sécurité HTTP
    add_header X-Content-Type-Options    "nosniff"                        always;
    add_header X-Frame-Options           "SAMEORIGIN"                     always;
    add_header X-XSS-Protection          "1; mode=block"                  always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # Angular SPA — toujours retourner index.html pour les routes client-side
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Variable upstream pour résolution DNS à la demande (pas de crash au démarrage)
    set $backend_upstream "backend.pfe.svc.cluster.local:8080";

    # Proxy API vers le backend Spring Boot (DNS K8s interne : namespace pfe)
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://$backend_upstream/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Proxy SSE (Server-Sent Events) — timeout long, pas de rate limit
    location /api/events/ {
        proxy_pass http://$backend_upstream/api/events/;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header Connection "";
        proxy_http_version  1.1;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
        proxy_cache         off;
        chunked_transfer_encoding on;
    }

    # Proxy actuator (health checks) — accès restreint
    location /actuator/ {
        proxy_pass http://$backend_upstream/actuator/;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny  all;
    }

    # Compression gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # Cache assets statiques (Angular hash dans les noms de fichiers)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
