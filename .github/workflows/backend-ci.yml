name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/backend/src/**"
      - "backend/backend/pom.xml"
      - "backend/backend/Dockerfile"
      - "backend/backend/infra/k8s/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/backend/src/**"
      - "backend/backend/pom.xml"
      - "backend/backend/Dockerfile"
      - ".github/workflows/backend-ci.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/pfe-backend

defaults:
  run:
    working-directory: backend/backend

jobs:
  # ── Job 1: Build + Test ────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pfe_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build & run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/pfe_db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          CAMUNDA_ENABLED: "false"
          AIOPS_POLLING_ENABLED: "false"
          INFRA_HEALTH_ENABLED: "false"
          NOTIFICATION_WEBHOOK_ENABLED: "false"
        run: ./mvnw clean verify -B

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/backend/target/surefire-reports/
          retention-days: 7

  # ── Job 2: Docker Build + Trivy Scan + Push ───────────────────────────────
  docker-publish:
    name: Docker Build, Scan & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata (SHA-based tag)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image (local for scan)
        uses: docker/build-push-action@v6
        with:
          context: backend/backend
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Upload Trivy SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"

      - name: Push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: backend/backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image as tar (for air-gapped deployment)
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          docker save ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} \
            -o /tmp/pfe-backend.tar

      - name: Upload image tar artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ steps.meta.outputs.version }}
          path: /tmp/pfe-backend.tar
          retention-days: 3

  # ── Job 3: Smoke Test ─────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pfe_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build JAR (skip tests)
        run: ./mvnw clean package -DskipTests -B -q

      - name: Start backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/pfe_db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          CAMUNDA_ENABLED: "false"
          AIOPS_POLLING_ENABLED: "false"
          INFRA_HEALTH_ENABLED: "false"
          NOTIFICATION_WEBHOOK_ENABLED: "false"
        run: |
          java -jar target/*.jar &
          echo "BACKEND_PID=$!" >> $GITHUB_ENV

      - name: Wait for backend readiness
        run: |
          for i in $(seq 1 30); do
            if curl -sf -u operator:operator-change-me \
              http://localhost:8080/actuator/health/readiness > /dev/null 2>&1; then
              echo "Backend ready"
              break
            fi
            echo "Waiting ($i/30)…"
            sleep 3
          done

      - name: Smoke test — core endpoints
        run: |
          curl -sf -u operator:operator-change-me \
            http://localhost:8080/actuator/health | python3 -m json.tool

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -u operator:operator-change-me \
            "http://localhost:8080/api/incidents?page=0&size=5")
          echo "Incidents: HTTP $STATUS"
          [ "$STATUS" = "200" ]

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -u operator:operator-change-me \
            http://localhost:8080/api/infrastructure/health)
          echo "Infra health: HTTP $STATUS"
          [ "$STATUS" = "200" ]

      - name: Stop backend
        if: always()
        run: kill $BACKEND_PID || true

  # ── Job 4: Deploy to K8s cluster ─────────────────────────────────────────
  #
  # DEFAULT (C-1 fix): runs-on self-hosted runner installed on master VM.
  # The runner connects OUT to GitHub — no inbound SSH port needed.
  # Setup: bash scripts/setup-github-runner.sh   (run on VM 192.168.148.153)
  #
  # FALLBACK: set repository variable RUNNER_MODE=ssh to use the SSH-based path
  # with secrets DEPLOY_SSH_KEY + DEPLOY_HOST instead.
  deploy:
    name: Deploy to Cluster
    runs-on: ${{ vars.RUNNER_MODE == 'ssh' && 'ubuntu-latest' || 'self-hosted' }}
    needs: [docker-publish, smoke-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Download image tar
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ needs.docker-publish.outputs.image-tag }}
          path: /tmp/

      # ── Self-hosted runner path (default) ─────────────────────────────────
      # The runner already runs on the master VM — kubectl and ctr are available.
      - name: Deploy via self-hosted runner
        if: ${{ vars.RUNNER_MODE != 'ssh' }}
        env:
          IMAGE_TAR: /tmp/pfe-backend.tar
          IMAGE_REF: ${{ needs.docker-publish.outputs.image-ref }}
          WORKERS: "192.168.148.158 192.168.148.155"
        run: |
          set -euo pipefail
          echo "[1/4] Importing image on master"
          sudo ctr -n k8s.io images import "${IMAGE_TAR}"

          echo "[2/4] Distributing to workers"
          for worker in $WORKERS; do
            scp "${IMAGE_TAR}" "kube@${worker}:/tmp/pfe-backend.tar" && \
            ssh "kube@${worker}" "sudo ctr -n k8s.io images import /tmp/pfe-backend.tar && rm /tmp/pfe-backend.tar" &
          done
          wait

          echo "[3/4] kubectl set image"
          kubectl set image deployment/backend backend="${IMAGE_REF}" -n pfe

          echo "[4/4] Rollout status (120s timeout)"
          if ! kubectl rollout status deployment/backend -n pfe --timeout=120s; then
            echo "Rollout FAILED — rolling back"
            kubectl rollout undo deployment/backend -n pfe
            kubectl rollout status deployment/backend -n pfe --timeout=60s
            exit 1
          fi
          kubectl get pods -n pfe -l app=backend
          rm -f "${IMAGE_TAR}"

      # ── SSH fallback path (RUNNER_MODE=ssh) ───────────────────────────────
      - name: Install SSH key (SSH fallback only)
        if: ${{ vars.RUNNER_MODE == 'ssh' }}
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Copy image tar to master (SSH fallback only)
        if: ${{ vars.RUNNER_MODE == 'ssh' }}
        run: |
          scp -i ~/.ssh/id_ed25519 /tmp/pfe-backend.tar \
            kube@${{ secrets.DEPLOY_HOST }}:/tmp/pfe-backend.tar

      - name: Deploy via SSH (fallback)
        if: ${{ vars.RUNNER_MODE == 'ssh' }}
        env:
          IMAGE_REF: ${{ needs.docker-publish.outputs.image-ref }}
        run: |
          ssh -i ~/.ssh/id_ed25519 kube@${{ secrets.DEPLOY_HOST }} "bash -s" << 'SSHEOF'
            set -euo pipefail
            IMAGE_TAR="/tmp/pfe-backend.tar"
            WORKERS="192.168.148.158 192.168.148.155"
            sudo ctr -n k8s.io images import "${IMAGE_TAR}"
            for w in $WORKERS; do
              scp "${IMAGE_TAR}" "kube@${w}:/tmp/pfe-backend.tar" && \
              ssh "kube@${w}" "sudo ctr -n k8s.io images import /tmp/pfe-backend.tar && rm /tmp/pfe-backend.tar" &
            done
            wait
            kubectl set image deployment/backend backend="${IMAGE_REF}" -n pfe
            if ! kubectl rollout status deployment/backend -n pfe --timeout=120s; then
              kubectl rollout undo deployment/backend -n pfe
              exit 1
            fi
            rm -f "${IMAGE_TAR}"
          SSHEOF
        env:
          IMAGE_REF: ${{ needs.docker-publish.outputs.image-ref }}
