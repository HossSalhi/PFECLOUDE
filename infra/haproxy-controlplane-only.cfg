# =============================================================================
# OBSOLETE (4 nov. 2026, HA-01) — conservé comme référence historique uniquement.
# La configuration HAProxy CANONIQUE, déployée à l'identique sur .160 ET .162, est infra/ha01/haproxy/haproxy.cfg
# (API :6443 avec .153 en `backup`, web/HTTPS vers Traefik en hostNetwork :8000/:8443, redispatch, détection rapide).
# =============================================================================
# =============================================================================
# HELIOS — HAProxy : UNIQUEMENT control-plane Kubernetes
# =============================================================================
# Remplace l'ancien haproxy-apps-lb.cfg + haproxy-controlplane.cfg.
#
# AVANT (non-K8s) :
#   HAProxy gerait le trafic APPLICATIF (ports 80/443 -> NodePort ingress)
#   + Keepalived VIP .150 entre .160 et .162
#   -> Cela contournait les Services K8s natifs.
#
# MAINTENANT (K8s-natif) :
#   - Trafic APPLICATIF : MetalLB + ingress-nginx LoadBalancer (dans le cluster)
#   - HAProxy ne gere QUE l'API Kubernetes (port 6443) pour kubeadm HA
#   - Keepalived / VIP = SUPPRIME (MetalLB fait le LB K8s-natif)
#
# HAProxy reste necessaire pour kubeadm HA : c'est le controlPlaneEndpoint
# recommande par la doc Kubernetes pour les clusters bare-metal multi-masters.
# Les kubelets et kubectl pointent vers .160:6443, HAProxy repartit vers les
# 3 API servers.
#
# A COPIER dans /etc/haproxy/haproxy.cfg sur .160
# =============================================================================

global
    log /dev/log local0
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    maxconn 2048

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    retries 3

# ─── Control Plane Kubernetes (kubeadm HA) ───────────────────────
# Le seul role de HAProxy : repartir les requetes API K8s vers les 3 masters.
# controlPlaneEndpoint = 192.168.148.160:6443
frontend k8s_api
    bind *:6443
    mode tcp
    option tcplog
    default_backend k8s_masters

backend k8s_masters
    mode tcp
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 check check-ssl verify none
    server master  192.168.148.153:6443
    server worker1 192.168.148.158:6443
    server worker2 192.168.148.155:6443

# ─── Stats (monitoring du HAProxy) ───────────────────────────────
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 10s
