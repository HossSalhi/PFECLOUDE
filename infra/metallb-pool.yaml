# =============================================================================
# MetalLB — LoadBalancer K8s-natif pour bare-metal
# =============================================================================
# Remplace le HAProxy externe + Keepalived VIP pour le trafic APPLICATIF.
# MetalLB attribue des IP du pool aux Services type=LoadBalancer (ingress-nginx).
#
# Chaine K8s-native :
#   Client -> MetalLB IP (.200) -> ingress-nginx -> Service -> Pods
#
# Install MetalLB : kubectl apply -f https://raw.githubusercontent.com/metallb/metallb/v0.14.8/config/manifests/metallb-native.yaml
# Appliquer ce fichier : kubectl apply -f metallb-pool.yaml
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: helios-pool
  namespace: metallb-system
spec:
  addresses:
  - 192.168.148.200-192.168.148.210
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: helios-l2
  namespace: metallb-system
spec:
  ipAddressPools:
  - helios-pool
