# OBSOLETE (4 nov. 2026, HA-01) — conservé comme référence historique uniquement.
# La configuration HAProxy CANONIQUE, déployée à l'identique sur .160 ET .162, est infra/ha01/haproxy/haproxy.cfg
# (API :6443 avec .153 en `backup`, web/HTTPS vers Traefik en hostNetwork :8000/:8443, redispatch, détection rapide).
# =============================================================================
# HAProxy (sur la VM .160) — LB du control-plane Kubernetes, remplace le VIP keepalived .150.
# A APPEND a /etc/haproxy/haproxy.cfg (apres les sections global/defaults par defaut).
# Prerequis : .160 ajoute aux SAN des certs apiserver des 3 masters.
# Puis : controlPlaneEndpoint + kubelet.conf des 3 masters -> https://192.168.148.160:6443

frontend k8s_api
    bind *:6443
    mode tcp
    option tcplog
    default_backend k8s_masters

backend k8s_masters
    mode tcp
    balance roundrobin
    option httpchk
    http-check send meth GET uri /healthz
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 check check-ssl verify none
    server master  192.168.148.153:6443
    server worker1 192.168.148.158:6443
    server worker2 192.168.148.155:6443

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
