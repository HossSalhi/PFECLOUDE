# =============================================================================
# HELIOS — Configuration Prometheus : couverture des 6 VMs + Kubernetes
# =============================================================================
# A DEPLOYER : /etc/prometheus/prometheus.yml sur .160
# Recharger  : systemctl reload prometheus  (ou curl -X POST localhost:9090/-/reload)
#
# COUVERTURE :
#   .153 .158 .155  -> noeuds K8s   : node_exporter + kubelet + cAdvisor + apiserver + etcd
#   .160            -> monitoring   : node_exporter + prometheus + loki + grafana + haproxy
#   .161            -> Camunda      : node_exporter + zeebe (service IA et Ollama retirés le 11 nov. 2026)
#   .162            -> LB2          : node_exporter + haproxy
#   Cluster K8s     -> kube-state-metrics (etat des objets : pods, deploys, ...)
#
# PREREQUIS sur CHAQUE VM non-K8s (.160 .161 .162) :
#   apt install -y prometheus-node-exporter
#   systemctl enable --now prometheus-node-exporter    # ecoute :9100
# =============================================================================

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: helios
    site: orange-tunisie

# ─── Alertmanager : c'est LUI qui pousse vers Camunda ────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:

  # ══════════════════════════════════════════════════════════════
  #  1. HOST — les 6 VMs (node_exporter)
  # ══════════════════════════════════════════════════════════════
  # Couvre : CPU, RAM, disque, filesystem, I/O, reseau, load, uptime,
  #          processus, services systemd (via --collector.systemd)
  - job_name: 'node'
    static_configs:
      - targets: ['192.168.148.153:9100']
        labels: {vm: k8s-master,     role: k8s-node,    tier: cluster}
      - targets: ['192.168.148.158:9100']
        labels: {vm: k8s-worker1,    role: k8s-node,    tier: cluster}
      - targets: ['192.168.148.155:9100']
        labels: {vm: k8s-worker2,    role: k8s-node,    tier: cluster}
      - targets: ['192.168.148.160:9100']
        labels: {vm: k8s-monitoring, role: monitoring,  tier: platform}
      - targets: ['192.168.148.161:9100']
        labels: {vm: k8s-aicamunda,  role: orchestrator, tier: platform}
      - targets: ['192.168.148.162:9100']
        labels: {vm: k8s-lb2,        role: lb-secondary, tier: platform}
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: instance_ip

  # ══════════════════════════════════════════════════════════════
  #  2. KUBERNETES — Control plane
  # ══════════════════════════════════════════════════════════════
  # kube-apiserver : latence, taux d'erreur, requetes en vol
  - job_name: 'kube-apiserver'
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/k8s/ca.crt
      insecure_skip_verify: true
    authorization:
      credentials_file: /etc/prometheus/k8s/token
    static_configs:
      - targets:
          - '192.168.148.153:6443'
          - '192.168.148.158:6443'
          - '192.168.148.155:6443'
        labels: {component: kube-apiserver}

  # etcd : quorum, leader, latence fsync, taille DB
  # PREREQUIS : --listen-metrics-urls=http://0.0.0.0:2381 dans le manifeste etcd
  #
  # ⚠️ CLUSTER ETCD A 5 MEMBRES : les 3 noeuds K8s + .160 + .162.
  # .160 et .162 sont des membres VOTANTS a part entiere (ajoutes en --learner
  # puis promus) : c'est ce qui fait passer la tolerance de 1 a 2 pannes.
  # .161 a ete RETIREE d'etcd (aucun role dans le maintien du cluster).
  #
  # Les 5 doivent etre scrapes : la regle EtcdQuorumLost compte les membres
  # ayant un leader. Si on n'en scrape que 3, le calcul du quorum est FAUX.
  - job_name: 'etcd'
    static_configs:
      - targets:
          - '192.168.148.153:2381'
          - '192.168.148.158:2381'
          - '192.168.148.155:2381'
        labels: {component: etcd, etcd_role: k8s-node}
      - targets:
          - '192.168.148.160:2381'
          - '192.168.148.162:2381'
        labels: {component: etcd, etcd_role: platform-witness}

  # kube-scheduler : leader election, latence de scheduling, pods non planifiables
  # PREREQUIS : --bind-address=0.0.0.0 dans le manifeste scheduler
  - job_name: 'kube-scheduler'
    scheme: https
    tls_config: {insecure_skip_verify: true}
    authorization:
      credentials_file: /etc/prometheus/k8s/token
    static_configs:
      - targets:
          - '192.168.148.153:10259'
          - '192.168.148.158:10259'
          - '192.168.148.155:10259'
        labels: {component: kube-scheduler}

  # kube-controller-manager : leader election, boucles de reconciliation
  - job_name: 'kube-controller-manager'
    scheme: https
    tls_config: {insecure_skip_verify: true}
    authorization:
      credentials_file: /etc/prometheus/k8s/token
    static_configs:
      - targets:
          - '192.168.148.153:10257'
          - '192.168.148.158:10257'
          - '192.168.148.155:10257'
        labels: {component: kube-controller-manager}

  # ══════════════════════════════════════════════════════════════
  #  3. KUBERNETES — Kubelet & conteneurs
  # ══════════════════════════════════════════════════════════════
  # kubelet : etat du noeud, volumes, runtime, pods geres
  - job_name: 'kubelet'
    scheme: https
    tls_config: {insecure_skip_verify: true}
    authorization:
      credentials_file: /etc/prometheus/k8s/token
    kubernetes_sd_configs:
      - role: node
        api_server: https://192.168.148.160:6443
        tls_config: {insecure_skip_verify: true}
        authorization: {credentials_file: /etc/prometheus/k8s/token}
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: 192.168.148.160:6443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics

  # cAdvisor : CPU/RAM/reseau/disque PAR CONTENEUR (integre au kubelet)
  # -> permet de detecter OOMKilled, throttling CPU, saturation par pod
  - job_name: 'cadvisor'
    scheme: https
    tls_config: {insecure_skip_verify: true}
    authorization:
      credentials_file: /etc/prometheus/k8s/token
    kubernetes_sd_configs:
      - role: node
        api_server: https://192.168.148.160:6443
        tls_config: {insecure_skip_verify: true}
        authorization: {credentials_file: /etc/prometheus/k8s/token}
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: 192.168.148.160:6443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

  # ══════════════════════════════════════════════════════════════
  #  4. KUBERNETES — Etat des objets (kube-state-metrics)
  # ══════════════════════════════════════════════════════════════
  # Source de verite pour : CrashLoopBackOff, Pending, OOMKilled, Failed,
  # restart count, replicas dispo, deployments, replicasets, PVC, jobs...
  - job_name: 'kube-state-metrics'
    static_configs:
      - targets: ['127.0.0.1:8080']   # kube-state-metrics EXTERNALISE sur .160 (systemd)
        labels: {component: kube-state-metrics}

  # ══════════════════════════════════════════════════════════════
  #  5. APPLICATIONS — Pods annotes prometheus.io/scrape
  # ══════════════════════════════════════════════════════════════
  - job_name: 'k8s-pods'
    kubernetes_sd_configs:
      - role: pod
        api_server: https://192.168.148.160:6443
        tls_config: {insecure_skip_verify: true}
        authorization: {credentials_file: /etc/prometheus/k8s/token}
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: app

  # ══════════════════════════════════════════════════════════════
  #  6. SERVICES PLATEFORME (hors cluster)
  # ══════════════════════════════════════════════════════════════
  # Camunda Zeebe (.161) : jobs en attente, workflows actifs, backpressure
  - job_name: 'zeebe'
    static_configs:
      - targets: ['192.168.148.161:9600']
        labels: {vm: k8s-aicamunda, component: zeebe}
    metrics_path: /actuator/prometheus

  # HAProxy .160 et .162 : etat des backends, sessions, erreurs
  # PREREQUIS : bloc `listen stats ... stats enable` + exporter, ou HAProxy >=2.0
  #             avec `frontend stats / bind :8405 / http-request use-service prometheus-exporter`
  - job_name: 'haproxy'
    static_configs:
      - targets: ['192.168.148.160:8405']
        labels: {vm: k8s-monitoring, component: haproxy, role: primary}
      - targets: ['192.168.148.162:8405']
        labels: {vm: k8s-lb2,        component: haproxy, role: secondary}

  # ══════════════════════════════════════════════════════════════
  #  7. AUTO-SURVEILLANCE de la stack monitoring
  # ══════════════════════════════════════════════════════════════
  # Sans cela, une panne de Prometheus/Loki/Grafana passe inapercue.
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels: {vm: k8s-monitoring, component: prometheus}

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['localhost:9093']
        labels: {vm: k8s-monitoring, component: alertmanager}

  - job_name: 'loki'
    static_configs:
      - targets: ['localhost:3100']
        labels: {vm: k8s-monitoring, component: loki}
    metrics_path: /metrics

  - job_name: 'grafana'
    static_configs:
      - targets: ['localhost:3000']
        labels: {vm: k8s-monitoring, component: grafana}
    metrics_path: /metrics

  # ══════════════════════════════════════════════════════════════
  #  8. BLACKBOX — Joignabilite reseau des 6 VMs
  # ══════════════════════════════════════════════════════════════
  # Complementaire a node_exporter : si node_exporter tombe MAIS la VM est up,
  # `up==0` seul ne permet pas de distinguer "VM morte" de "exporter mort".
  # Le blackbox_exporter (ICMP) tranche.
  # PREREQUIS : apt install prometheus-blackbox-exporter  (port 9115)
  - job_name: 'blackbox-icmp'
    metrics_path: /probe
    params: {module: [icmp]}
    static_configs:
      - targets:
          - 192.168.148.153
          - 192.168.148.158
          - 192.168.148.155
          - 192.168.148.160
          - 192.168.148.161
          - 192.168.148.162
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  # Sonde HTTP : l'application HELIOS repond-elle vraiment ?
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params: {module: [http_2xx]}
    static_configs:
      - targets:
          - http://helios.orange.tn/
          - http://192.168.148.161:8080/actuator/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
