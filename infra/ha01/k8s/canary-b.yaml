  template:
    metadata:
      labels: {app: ha01-canary-w2, helios.io/monitor: "false", ha01/role: canary}
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker2
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: canary
          image: ghcr.io/cloudnative-pg/postgresql:16
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              H="${POSTGRES_RW_SERVICE_HOST:?variable de service absente}"
              SRC=w2
              CS="host=$H port=5432 dbname=ha01 user=$PGUSER connect_timeout=3 keepalives=1 keepalives_idle=2 keepalives_interval=1 keepalives_count=3 tcp_user_timeout=4000 application_name=ha01-canary-$SRC"
              while true; do
                { while true; do echo "INSERT INTO canary(src) VALUES ('$SRC') RETURNING id;"; sleep 0.2; done; } \
                  | psql "$CS" -At -q -w -v ON_ERROR_STOP=0 2>&1 \
                  | while IFS= read -r l; do echo "${EPOCHREALTIME} $l"; done
                echo "${EPOCHREALTIME} SESSION_END"
                sleep 0.5
              done
          env:
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: postgres-app, key: username}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: postgres-app, key: password}}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
