# =============================================================================
# HELIOS — HAProxy canonique (HA-01). Identique sur .160 et .162 (actif/actif).
# AUCUN VIP / keepalived / VRRP : la bascule se fait côté client (DNS à santé contrôlée
# + repli des navigateurs), cf. infra/ha01/dns/.
# Remplace les anciens infra/haproxy-apps-lb.cfg, haproxy-controlplane-only.cfg, haproxy-controlplane.cfg.
#
# Écarts par rapport à la config précédente (3 nov. 2026) :
#   - option redispatch 1  : un échec de connexion est retenté sur UN AUTRE serveur (avant : sur le même, x3)
#   - timeout connect/check 3s ; apps : inter 2s fastinter 1s downinter 2s fall 2 rise 2 (détection ~4-6 s au lieu de 15 s)
#   - on-marked-down shutdown-sessions : les sessions vers un serveur déclaré mort sont coupées tout de suite
#   - timeout tunnel 1h : sessions TCP longues (watch API Kubernetes, SSE en TLS passthrough) non coupées à 50 s
#   - .153 retiré des backends applicatifs (nœud fragile, aucune réplique ingress dessus) ; en SECOURS (backup) dans k8s_masters
#   - le backend https est contrôlé comme le http (GET / sur le NodePort http du même nœud) au lieu d'un simple TCP
#   - E16 (4 nov. 2026, arrêts réels de .155) : les backends web sont contrôlés sur `GET /ping` de Traefik (entrypoint `ping` :8082, indépendant de
#     l'application) et NON plus sur `GET / Host: helios.orange.tn` qui traversait Traefik puis le pod frontend. Mesuré (journal HAProxy du 4 nov. 12:35Z) :
#     pendant ~45 s après la mort d'un worker ses pods restent dans les endpoints ; un contrôle sur deux du SURVIVANT tombait sur le pod mort, dépassait
#     3 s (« Layer7 timeout ») et le survivant était déclaré DOWN à son tour -> « backend has no server available » -> coupure web de 11 à 32 s.
#     `timeout connect 1s` sur ces deux backends (LAN) : une connexion vers un nœud mort est retentée sur l'autre serveur après 1 s au lieu de 3 s.
# =============================================================================
global
	log /dev/log	local0
	log /dev/log	local1 notice
	chroot /var/lib/haproxy
	stats socket /run/haproxy/admin.sock mode 660 level admin
	stats timeout 30s
	user haproxy
	group haproxy
	daemon

	# Default SSL material locations
	ca-base /etc/ssl/certs
	crt-base /etc/ssl/private

	# See: https://ssl-config.mozilla.org/#server=haproxy&server-version=2.0.3&config=intermediate
        ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
        ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
        ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
	log	global
	mode	http
	option	httplog
	option	dontlognull
	retries 3
	option redispatch 1
	timeout connect 3s
	timeout check 3s
	timeout client  50s
	timeout server  50s
	timeout tunnel  1h
	errorfile 400 /etc/haproxy/errors/400.http
	errorfile 403 /etc/haproxy/errors/403.http
	errorfile 408 /etc/haproxy/errors/408.http
	errorfile 500 /etc/haproxy/errors/500.http
	errorfile 502 /etc/haproxy/errors/502.http
	errorfile 503 /etc/haproxy/errors/503.http
	errorfile 504 /etc/haproxy/errors/504.http


#=== API Kubernetes (api.helios.orange.tn:6443) : TLS passthrough vers les 3 apiservers ===
frontend k8s_api
    bind *:6443
    mode tcp
    option tcplog
    default_backend k8s_masters

backend k8s_masters
    mode tcp
    balance roundrobin
    option httpchk
    http-check send meth GET uri /readyz
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 check check-ssl verify required ca-file /etc/haproxy/certs/helios-kubernetes-ca.crt verifyhost api.helios.orange.tn check-sni api.helios.orange.tn on-marked-down shutdown-sessions
    # .153 en SECOURS seulement : mesuré le 3 nov. (5 incidents, 16:34 -> 22:10 UTC) — chaque pic de saturation CPU de .153 (PSI 0,7-1,3)
    # faisait échouer ~1/3 des requêtes sur les DEUX LB et les deux points de mesure, car le round-robin lui envoyait 1/3 du trafic.
    # Il garde ses usages locaux (kubelet, controller-manager, scheduler) et reprend l'API seulement si les 2 workers sont indisponibles.
    server master  192.168.148.153:6443 backup
    server worker1 192.168.148.158:6443
    server worker2 192.168.148.155:6443

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /

# ============================================================================
# Trafic applicatif -> ingress des workers .155 et .158 (NodePorts du Service ingress-nginx-controller)
#   http  : 31756   https : 31411   (Traefik en shadow : 32080 / 32443, cf. Phase 3)
# ============================================================================
frontend apps_http
    bind *:80
    mode http
    option forwardfor
    option httplog
    default_backend ingress_http

backend ingress_http
    mode http
    balance roundrobin
    # Santé = le processus Traefik (/ping, entrypoint `ping` :8082), pas le chemin applicatif (cf. E16 en tête de fichier).
    option httpchk
    http-check send meth GET uri /ping
    http-check expect status 200
    timeout connect 1s
    timeout check 2s
    default-server inter 2s fastinter 1s downinter 2s fall 2 rise 2 check port 8082 on-marked-down shutdown-sessions
    server node-155 192.168.148.155:8000
    server node-158 192.168.148.158:8000

frontend apps_https
    bind *:443
    mode tcp
    option tcplog
    default_backend ingress_https

backend ingress_https
    mode tcp
    balance roundrobin
    # TLS terminé par Traefik (Secret helios-tls). Santé = le processus Traefik du même nœud (/ping :8082), pas le chemin applicatif (cf. E16).
    option httpchk
    http-check send meth GET uri /ping
    http-check expect status 200
    timeout connect 1s
    timeout check 2s
    default-server inter 2s fastinter 1s downinter 2s fall 2 rise 2 check port 8082 on-marked-down shutdown-sessions
    server node-155 192.168.148.155:8443
    server node-158 192.168.148.158:8443
