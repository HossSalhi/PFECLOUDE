# =============================================================================
# HELIOS — Keepalived pour la VM Monitoring (.160) — MASTER
# =============================================================================
# Copier vers : /etc/keepalived/keepalived.conf sur .160
# Installer : apt install keepalived -y
# Activer : systemctl enable --now keepalived
#
# VIP 192.168.148.150 flotte entre .160 (priorite 100) et .162 (priorite 90).
# Si .160 tombe, .162 prend la VIP en ~3s (VRRP advertisement interval).
# La VIP est utilisee par :
#   - HAProxy apps (clients -> VIP:80/443 -> NodePort ingress)
#   - HAProxy control-plane (kubelets -> VIP:6443 -> API servers)
#   - Prometheus/Grafana (optionnel, si DNS pointe vers la VIP)
# =============================================================================

global_defs {
    router_id HELIOS_LB_160
    enable_script_security
    script_user root
}

# Health check : HAProxy doit tourner pour que ce noeud garde la VIP
vrrp_script check_haproxy {
    script "/usr/bin/killall -0 haproxy"
    interval 2        # verifier toutes les 2s
    weight -30        # si HAProxy est down, baisser la priorite de 30
    fall 3            # 3 echecs = declare down
    rise 2            # 2 succes = declare up
}

vrrp_instance HELIOS_VIP {
    state MASTER
    interface ens33                   # adapter au nom de l'interface reseau
    virtual_router_id 51             # DOIT etre identique sur .160 et .162
    priority 100                     # .160 = priorite haute (master)
    advert_int 1                     # advertisement toutes les 1s

    authentication {
        auth_type PASS
        auth_pass H3l10sVIP          # mot de passe VRRP (identique sur .160 et .162)
    }

    virtual_ipaddress {
        192.168.148.150/24           # VIP qui flotte
    }

    track_script {
        check_haproxy
    }

    # Notifications (optionnel — pour le monitoring)
    notify_master "/bin/echo 'HELIOS VIP: .160 est MASTER' | logger -t keepalived"
    notify_backup "/bin/echo 'HELIOS VIP: .160 est BACKUP' | logger -t keepalived"
    notify_fault  "/bin/echo 'HELIOS VIP: .160 est en FAULT' | logger -t keepalived"
}
