# =============================================================================
# HELIOS — Keepalived pour LB2 (.162) — BACKUP
# =============================================================================
# Copier vers : /etc/keepalived/keepalived.conf sur .162
# Installer : apt install keepalived -y
# Activer : systemctl enable --now keepalived
#
# .162 est en standby. Il prend la VIP uniquement si .160 est down.
# =============================================================================

global_defs {
    router_id HELIOS_LB_162
    enable_script_security
    script_user root
}

vrrp_script check_haproxy {
    script "/usr/bin/killall -0 haproxy"
    interval 2
    weight -30
    fall 3
    rise 2
}

vrrp_instance HELIOS_VIP {
    state BACKUP
    interface ens33                   # adapter au nom de l'interface reseau
    virtual_router_id 51             # IDENTIQUE a .160
    priority 90                      # .162 = priorite basse (backup)
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass H3l10sVIP          # IDENTIQUE a .160
    }

    virtual_ipaddress {
        192.168.148.150/24
    }

    track_script {
        check_haproxy
    }

    notify_master "/bin/echo 'HELIOS VIP: .162 est MASTER (failover)' | logger -t keepalived"
    notify_backup "/bin/echo 'HELIOS VIP: .162 est BACKUP' | logger -t keepalived"
    notify_fault  "/bin/echo 'HELIOS VIP: .162 est en FAULT' | logger -t keepalived"
}
