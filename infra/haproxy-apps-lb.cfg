# =============================================================================
# HELIOS — HAProxy : répartition du trafic APPLICATIF
# =============================================================================
# À AJOUTER à /etc/haproxy/haproxy.cfg sur .160 ET .162.
# Les deux machines portent une configuration IDENTIQUE et servent en même temps
# (actif/actif). PAS DE VIP : le basculement se fait côté client, en résolvant
# helios.orange.tn vers les DEUX adresses .160 et .162 (round-robin DNS ou deux
# lignes dans le fichier hosts). Un navigateur bascule tout seul si l'une ne
# répond pas. keepalived a été volontairement écarté (choix : pas de VIP).
#
# Remplace le nginx qui tournait auparavant sur chacun des 3 nœuds du cluster
# (purgé le 31/07/2026).
#
# Chaîne : navigateur → HAProxy (.160 ou .162) → NodePort ingress d'un des
#          3 nœuds → ingress-nginx → Service frontend → pods
#
# NodePorts de l'ingress (à revérifier si le Service est recréé) :
#   kubectl -n ingress-nginx get svc ingress-nginx-controller
#   http = 31756 · https = 31411
# =============================================================================

frontend apps_http
    bind *:80
    mode http
    option forwardfor
    option httplog
    default_backend ingress_http

backend ingress_http
    mode http
    balance roundrobin
    # Le NodePort répond sur n'importe quel nœud, même sans pod ingress local
    # (kube-proxy route en interne) — mais un nœud éteint doit être retiré vite.
    option httpchk
    http-check send meth GET uri / hdr Host helios.orange.tn
    http-check expect status 200,301,302,404
    default-server inter 5s fall 3 rise 2 check
    server node-153 192.168.148.153:31756
    server node-155 192.168.148.155:31756
    server node-158 192.168.148.158:31756

frontend apps_https
    bind *:443
    # mode tcp : le TLS est terminé par l'ingress (Secret helios-tls), pas ici.
    mode tcp
    option tcplog
    default_backend ingress_https

backend ingress_https
    mode tcp
    balance roundrobin
    default-server inter 5s fall 3 rise 2 check
    server node-153 192.168.148.153:31411
    server node-155 192.168.148.155:31411
    server node-158 192.168.148.158:31411
