# =============================================================================
# OBSOLETE — Remplace par MetalLB + ingress-nginx LoadBalancer (K8s-natif)
# =============================================================================
# Ce fichier est CONSERVE comme reference historique uniquement.
# Le trafic applicatif passe maintenant par :
#   Client -> MetalLB IP (.200) -> ingress-nginx (LoadBalancer) -> Service -> Pods
# Voir : infra/metallb-pool.yaml + infra/08-metallb-ingress-pro.sh
# MISE À JOUR 4 nov. 2026 (HA-01) : l'état RÉEL est HAProxy actif/actif sur .160 + .162 -> Traefik en hostNetwork (:8000/:8443) ;
# la configuration canonique (identique sur les 2 LB) est infra/ha01/haproxy/haproxy.cfg — voir infra/ha01/README-HA-01.md.
# =============================================================================
# ANCIEN CONTENU (DEPRECATED) :
# =============================================================================
# HELIOS — HAProxy : repartition du trafic APPLICATIF
# =============================================================================
# A AJOUTER a /etc/haproxy/haproxy.cfg sur .160 ET .162.
# Les deux machines portent une configuration IDENTIQUE.
#
# HA : Keepalived (VRRP) avec VIP 192.168.148.150 entre .160 (MASTER, priorité
# 100) et .162 (BACKUP, priorité 90). Le trafic arrive sur la VIP, Keepalived
# la maintient sur .160 ; si .160 tombe, .162 prend la VIP en ~3s.
# Résolution DNS : helios.orange.tn → 192.168.148.150 (VIP).
#
# Chaîne : navigateur → VIP (.150) → HAProxy (.160 ou .162) → NodePort ingress
#          d'un des 3 nœuds → ingress-nginx → Service frontend → pods
#
# NodePorts de l'ingress (à revérifier si le Service est recréé) :
#   kubectl -n ingress-nginx get svc ingress-nginx-controller
#   http = 31756 · https = 31411
# =============================================================================

frontend apps_http
    bind *:80
    mode http
    option forwardfor
    option httplog
    default_backend ingress_http

backend ingress_http
    mode http
    balance roundrobin
    # Le NodePort répond sur n'importe quel nœud, même sans pod ingress local
    # (kube-proxy route en interne) — mais un nœud éteint doit être retiré vite.
    option httpchk
    http-check send meth GET uri / hdr Host helios.orange.tn
    http-check expect status 200,301,302,404
    default-server inter 5s fall 3 rise 2 check
    server node-153 192.168.148.153:31756
    server node-155 192.168.148.155:31756
    server node-158 192.168.148.158:31756

frontend apps_https
    bind *:443
    # mode tcp : le TLS est terminé par l'ingress (Secret helios-tls), pas ici.
    mode tcp
    option tcplog
    default_backend ingress_https

backend ingress_https
    mode tcp
    balance roundrobin
    default-server inter 5s fall 3 rise 2 check
    server node-153 192.168.148.153:31411
    server node-155 192.168.148.155:31411
    server node-158 192.168.148.158:31411
