# nginx (sur la VM .160) — LB externe des applications, point d'entree HTTP.
# A poser dans /etc/nginx/conf.d/helios-lb.conf (desactiver le default sur :80).
# Route tout vers ingress-nginx (NodePort http, ici 31756) sur les 3 nodes ; l'Ingress
# route ensuite vers le frontend. SSE (temps reel) supporte : buffering off, http1.1, timeouts longs.

upstream helios_ingress {
    server 192.168.148.153:31756 max_fails=2 fail_timeout=5s;
    server 192.168.148.155:31756 max_fails=2 fail_timeout=5s;
    server 192.168.148.158:31756 max_fails=2 fail_timeout=5s;
}

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 20m;

    location / {
        proxy_pass http://helios_ingress;
        proxy_set_header Host helios.orange.tn;      # matche l'objet Ingress
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;                          # SSE /api/events/stream (indicateur EN LIGNE)
        proxy_read_timeout 3600s;
    }
}
