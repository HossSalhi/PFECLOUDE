apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ .Values.namespace }}
  labels:
    app: backend
    {{- include "helios.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    app: backend
  ports:
  - port: {{ .Values.backend.service.port }}
    targetPort: {{ .Values.backend.containerPort }}
    protocol: TCP
{{- if .Values.backend.nodePort.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: backend-nodeport
  namespace: {{ .Values.namespace }}
  labels:
    app: backend
    {{- include "helios.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    app: backend
  ports:
  - port: {{ .Values.backend.nodePort.port }}
    targetPort: {{ .Values.backend.containerPort }}
    nodePort: {{ .Values.backend.nodePort.nodePort }}
    protocol: TCP
{{- end }}
